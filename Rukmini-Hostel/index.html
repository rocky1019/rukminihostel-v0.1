<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#00695C">

    <title>Rukmini Hostel</title>

    <style>

        /* =====================================================
           RUKMINI HOSTEL
           INDEX / SPLASH SCREEN
           ===================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #00695C;
            overflow: hidden;
        }


        /* =====================================================
           SPLASH SCREEN
           ===================================================== */

        .splash-screen {
            width: 100%;
            height: 100vh;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            background: #2b2828;

            color: white;

            position: relative;
        }


        /* =====================================================
           SYNTH STUDIO BRANDING
           ===================================================== */

        .synth-brand {
            position: absolute;

            top: 24px;
            left: 50%;

            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;

            gap: 5px;

            white-space: nowrap;

            animation: none;
            transform: translateX(-50%);
        }

        .synth-brand img {
            width: 62px;
            height: 42px;

            object-fit: contain;

            display: block;
        }

        .synth-brand span {
            font-size: 16px;
            font-weight: 700;

            letter-spacing: 1.8px;

            background: linear-gradient(
                90deg,
                #C6FFF6,
                #BA9EFF,
                #F7A8F8
            );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }


        /* =====================================================
           LOGO
           ===================================================== */

        .logo-container {
            width: 105px;
            height: 105px;

            border-radius: 50%;

            background: white;

            display: flex;
            align-items: center;
            justify-content: center;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.20);

            margin-bottom: 25px;

            animation: none;
        }

        .logo-symbol {
            width: 100%;
            height: 100%;
        }

        .logo-symbol img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;

            border-radius: 50%;
        }


        /* =====================================================
           BRAND NAME
           ===================================================== */

        .brand-name {
            font-size: 32px;
            font-weight: 600;

            letter-spacing: 0.5px;

            animation: textAppear 0.8s ease;
        }

        .brand-subtitle {
            margin-top: 8px;

            font-size: 15px;
            font-weight: 400;

            opacity: 0.85;

            letter-spacing: 1px;

            animation: textAppear 1s ease;
        }


        /* =====================================================
           LOADING
           ===================================================== */

        .loading-container {
            position: absolute;

            bottom: 75px;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .loading-text {
            font-size: 13px;

            opacity: 0.75;

            margin-bottom: 13px;
        }

        .loading-bar {
            width: 130px;
            height: 3px;

            background: rgba(255, 255, 255, 0.25);

            border-radius: 10px;

            overflow: hidden;
        }

        .loading-progress {
            width: 0%;
            height: 100%;

            background: white;

            border-radius: 10px;

            animation: loading 1.8s ease forwards;
        }


        /* =====================================================
           FOOTER
           ===================================================== */

        .footer {
            position: absolute;

            bottom: 25px;

            font-size: 11px;

            opacity: 0.55;

            letter-spacing: 0.5px;
        }


        /* =====================================================
           ANIMATIONS
           ===================================================== */

        @keyframes logoAppear {

            0% {
                opacity: 0;
                transform: scale(0.65);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }


        @keyframes textAppear {

            0% {
                opacity: 0;
                transform: translateY(10px);
            }

            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }


        @keyframes synthBrandAppear {

            0% {
                opacity: 0;
                transform: translate(-50%, -8px);
            }

            100% {
                opacity: 1;
                transform: translate(-50%, 0);
            }
        }


        @keyframes loading {

            0% {
                width: 0%;
            }

            100% {
                width: 100%;
            }
        }


        /* =====================================================
           SMALL DEVICES
           ===================================================== */

        @media (max-height: 600px) {

            .synth-brand {
                top: 16px;
            }

            .synth-brand img {
                width: 52px;
                height: 36px;
            }

            .synth-brand span {
                font-size: 14px;
                letter-spacing: 1.5px;
            }

            .logo-container {
                width: 85px;
                height: 85px;

                margin-bottom: 18px;
            }

            .brand-name {
                font-size: 27px;
            }

            .loading-container {
                bottom: 50px;
            }
        }

    </style>
</head>


<body>

    <main class="splash-screen">


        <div class="synth-brand">

            <img
                src="assets/synthstudiorukmini.png"
                alt="Synth Studio"
            >

            <span>
                SYNTH STUDIO
            </span>

        </div>


        <div class="logo-container">

            <div class="logo-symbol">

                <img
                    src="assets/rukminilogo.png"
                    alt="Rukmini Hostel logo"
                >

            </div>

        </div>


        <h1 class="brand-name">
            Rukmini Hostel
        </h1>


        <p class="brand-subtitle">
            Hostel Management
        </p>


        <div class="loading-container">

            <div class="loading-text">
                Loading...
            </div>

            <div class="loading-bar">

                <div class="loading-progress"></div>

            </div>

        </div>


        <div class="footer">
            Rukmini Hostel
        </div>

    </main>


    <script>

        /* =====================================================
           ENTRY ROUTER
           =====================================================

           TEMPORARY AUTHENTICATION LOGIC

           Later this will be replaced by Firebase
           Authentication.

           For now:

           No session
               ↓
           login.html

           Session exists
               ↓
           dashboard.html
        */

        setTimeout(function () {

            const loggedIn =
                localStorage.getItem("rukmini_logged_in");

            if (loggedIn === "true") {

                window.location.href =
                    "pages/main/dashboard.html";

            } else {

                window.location.href =
                    "pages/auth/login.html";

            }

        }, 1800);

    </script>

</body>
</html>
