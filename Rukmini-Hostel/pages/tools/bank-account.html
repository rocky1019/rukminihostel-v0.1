<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bank Account - Rukmini Hostel</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#F5F7F6;color:#263238;padding-bottom:84px}
button,input,select{font:inherit}
.header{height:72px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:#00695C;border-bottom:1px solid #00574D;position:sticky;top:0;z-index:20}
.header-left{display:flex;align-items:center;gap:9px}
.back-button{width:34px;height:34px;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}.back-button svg{width:21px;height:21px;stroke-width:2.5}
.header-logo{width:43px;height:43px;border-radius:12px;object-fit:cover;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.header-title{display:flex;flex-direction:column;gap:3px}.header-title strong{font-size:17px;line-height:1;font-weight:700;color:#fff}.header-title span{font-size:11px;color:#B2DFDB}
.profile-button{width:40px;height:40px;border:1px solid #4DB6AC;border-radius:50%;background:#087D70;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}.profile-button svg{width:19px;height:19px}
.page{max-width:600px;margin:auto;padding:14px}
.card{background:#fff;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.09);margin-bottom:12px;overflow:hidden}
.summary{padding:16px}.summary-title{font-size:17px;font-weight:700;color:#00695C}.summary-text{font-size:12px;color:#777;margin-top:5px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.summary-box{border:1px solid #D7E5E3;border-radius:9px;padding:12px;background:#FAFCFB}.summary-box svg{width:19px;color:#00695C;margin-bottom:7px}.value{font-size:20px;font-weight:700}.label{font-size:11px;color:#777;margin-top:3px}
.section-title{color:#00695C;font-size:17px;font-weight:700;padding:14px 15px 11px;border-bottom:1px solid #E4EAEA}
.form{padding:14px}.field{margin-bottom:12px}.field:last-child{margin-bottom:0}label{display:block;font-size:12px;color:#666;margin-bottom:6px}
input,select{width:100%;border:1px solid #CFDDDB;border-radius:8px;background:#fff;color:#222;padding:12px 11px;outline:none}input:focus,select:focus{border-color:#00897B}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.primary{width:100%;border:0;border-radius:9px;background:#00695C;color:#fff;padding:13px;font-weight:700;cursor:pointer}
.account-row{padding:14px 15px;border-bottom:1px solid #EEF1F0;display:flex;align-items:center;gap:11px}.account-row:last-child{border-bottom:0}
.account-icon{width:42px;height:42px;border-radius:10px;background:#E6F4F2;color:#00695C;display:flex;align-items:center;justify-content:center}.account-icon svg{width:20px}
.account-main{flex:1}.account-name{font-size:14px;font-weight:700}.account-meta{font-size:11px;color:#777;margin-top:4px}.account-balance{font-size:14px;font-weight:700;color:#00695C}
.icon-btn{width:32px;height:32px;border:1px solid #C7DEDB;border-radius:8px;background:#fff;color:#00695C;display:flex;align-items:center;justify-content:center;cursor:pointer}.icon-btn svg{width:16px}
.empty{padding:25px 15px;text-align:center;color:#777;font-size:13px}.empty svg{width:30px;height:30px;color:#80CBC4;margin-bottom:8px}
.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:600px;height:72px;background:#00695C;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px 10px;z-index:50;box-shadow:0 -4px 15px rgba(0,77,70,.12)}
.nav-item{border:0;background:transparent;color:#B2DFDB;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:500;cursor:pointer}.nav-icon{width:36px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center}.nav-icon svg{width:18px;height:18px;stroke-width:2.6}.nav-item.active{color:#fff;font-weight:700}.nav-item.active .nav-icon{background:#80CBC4;color:#004D40}
@media(max-width:420px){.header{padding:0 16px}.page{padding:12px}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="header">
<div class="header-left">
<button class="back-button" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
<img src="../../assets/rukminilogo.png" class="header-logo" alt="Rukmini Hostel">
<div class="header-title"><strong>Bank Account</strong><span>Hostel Management</span></div>
</div>
<button class="profile-button" onclick="openProfile()"><i data-lucide="user-round"></i></button>
</header>

<main class="page">

<section class="card summary">
<div class="summary-title">Bank Accounts</div>
<div class="summary-text">Keep track of bank accounts used for hostel transactions.</div>
<div class="summary-grid">
<div class="summary-box"><i data-lucide="landmark"></i><div class="value">0</div><div class="label">Accounts</div></div>
<div class="summary-box"><i data-lucide="wallet"></i><div class="value">₹0</div><div class="label">Total Balance</div></div>
</div>
</section>

<section class="card">
<div class="section-title">Add Bank Account</div>
<div class="form">
<div class="field"><label for="bank">Bank Name</label><input id="bank" type="text" placeholder="e.g. State Bank of India"></div>
<div class="field"><label for="holder">Account Holder Name</label><input id="holder" type="text" placeholder="Enter account holder"></div>
<div class="form-grid">
<div class="field"><label for="number">Account Number</label><input id="number" type="text" inputmode="numeric" placeholder="Account number"></div>
<div class="field"><label for="type">Account Type</label><select id="type"><option>Savings</option><option>Current</option><option>Other</option></select></div>
</div>
<div class="field"><label for="ifsc">IFSC Code</label><input id="ifsc" type="text" placeholder="e.g. SBIN0000000"></div>
<button class="primary" onclick="saveAccount()">Save Bank Account</button>
</div>
</section>

<section class="card">
<div class="section-title">Saved Accounts</div>
<div class="empty"><i data-lucide="landmark"></i><div>No bank accounts added yet.</div><div style="font-size:11px;margin-top:4px">Saved accounts will appear here.</div></div>
</section>

<section class="card">
<div class="section-title">Account Actions</div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:13px">
<button class="icon-btn" style="width:100%;height:44px;gap:7px" onclick="alert('Transactions will be connected later.')"><i data-lucide="arrow-left-right"></i>Transactions</button>
<button class="icon-btn" style="width:100%;height:44px;gap:7px" onclick="alert('Account editing will be connected later.')"><i data-lucide="pencil"></i>Edit Account</button>
</div>
</section>

</main>

<nav class="bottom-nav">
<button class="nav-item" onclick="goTo('rent-plans')"><span class="nav-icon"><i data-lucide="receipt-text"></i></span><span>Rent Plan</span></button>
<button class="nav-item" onclick="goTo('tenants')"><span class="nav-icon"><i data-lucide="users-round"></i></span><span>Tenant</span></button>
<button class="nav-item" onclick="goTo('summary')"><span class="nav-icon"><i data-lucide="chart-no-axes-combined"></i></span><span>Summary</span></button>
<button class="nav-item active" onclick="goTo('action')"><span class="nav-icon"><i data-lucide="menu"></i></span><span>Action</span></button>
</nav>

<script>
lucide.createIcons();
function goTo(page){if(page==="rent-plans")window.location.href="../main/rent-plans.html";if(page==="tenants")window.location.href="../main/tenants.html";if(page==="summary")window.location.href="../main/summary.html";if(page==="action")window.location.href="../main/action.html";}
function openProfile(){window.location.href="profile.html";}
function saveAccount(){
const bank=document.getElementById("bank").value;
const holder=document.getElementById("holder").value;
const number=document.getElementById("number").value;
const ifsc=document.getElementById("ifsc").value;
if(!bank||!holder||!number||!ifsc){alert("Please fill in the bank account details.");return;}
alert("Bank account saved locally for now. Firebase will handle real records later.");
}
</script>
</body>
</html>
