
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Search - Rukmini Hostel</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#F5F7F6;color:#263238;padding-bottom:84px}
button,input{font:inherit}
.header{height:72px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:#00695C;border-bottom:1px solid #00574D;position:sticky;top:0;z-index:20}
.header-left{display:flex;align-items:center;gap:9px}
.back-button{width:34px;height:34px;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.back-button svg{width:21px;height:21px;stroke-width:2.5}
.header-logo{width:43px;height:43px;border-radius:12px;object-fit:cover;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.header-title{display:flex;flex-direction:column;gap:3px}
.header-title strong{font-size:17px;line-height:1;font-weight:700;color:#fff}
.header-title span{font-size:11px;color:#B2DFDB}
.profile-button{width:40px;height:40px;border:1px solid #4DB6AC;border-radius:50%;background:#087D70;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.profile-button svg{width:19px;height:19px}
.page{max-width:600px;margin:auto;padding:14px}
.card{background:#fff;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.09);margin-bottom:12px;overflow:hidden}
.search-box{padding:15px}
.search-wrap{display:flex;align-items:center;gap:9px;border:1px solid #CFDDDB;border-radius:10px;background:#fff;padding:0 12px}
.search-wrap:focus-within{border-color:#00897B}
.search-wrap svg{width:20px;color:#00695C;flex:none}
.search-wrap input{width:100%;border:0;outline:0;padding:13px 0;background:transparent;color:#222}
.filters{display:flex;gap:7px;padding:0 15px 14px;overflow-x:auto}
.filter{white-space:nowrap;border:1px solid #C7DEDB;background:#fff;color:#00695C;border-radius:20px;padding:7px 12px;font-size:11px;cursor:pointer}
.filter.active{background:#00695C;color:#fff;border-color:#00695C}
.section-title{color:#00695C;font-size:17px;font-weight:700;padding:14px 15px 11px;border-bottom:1px solid #E4EAEA}
.result{padding:14px 15px;border-bottom:1px solid #EEF1F0;display:flex;align-items:center;gap:11px;cursor:pointer}
.result:last-child{border-bottom:0}
.result:hover{background:#F8FBFA}
.result-icon{width:42px;height:42px;border-radius:10px;background:#E6F4F2;color:#00695C;display:flex;align-items:center;justify-content:center;flex:none}
.result-icon svg{width:20px}
.result-main{flex:1;min-width:0}
.result-title{font-size:14px;font-weight:700;overflow-wrap:anywhere}
.result-meta{font-size:11px;color:#777;margin-top:4px;line-height:1.5;overflow-wrap:anywhere}
.result-arrow{color:#9AA9A7}
.result-arrow svg{width:17px}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:13px}
.quick{border:1px solid #D7E5E3;background:#fff;border-radius:9px;padding:13px 10px;color:#00695C;cursor:pointer;display:flex;align-items:center;gap:9px;font-size:13px;font-weight:600}
.quick svg{width:19px}
.empty{padding:28px 15px;text-align:center;color:#777;font-size:13px}
.empty svg{width:31px;height:31px;color:#80CBC4;margin-bottom:8px}
.status{padding:15px;text-align:center;font-size:12px;color:#777}
.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:600px;height:72px;background:#00695C;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px 10px;z-index:50;box-shadow:0 -4px 15px rgba(0,77,70,.12)}
.nav-item{border:0;background:transparent;color:#B2DFDB;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:500;cursor:pointer}
.nav-icon{width:36px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center}
.nav-icon svg{width:18px;height:18px;stroke-width:2.6}
.nav-item.active{color:#fff;font-weight:700}
.nav-item.active .nav-icon{background:#80CBC4;color:#004D40}
@media(max-width:420px){.header{padding:0 16px}.page{padding:12px}}
</style>
</head>
<body>

<header class="header">
<div class="header-left">
<button class="back-button" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
<img src="../../assets/rukminilogo.png" class="header-logo" alt="Rukmini Hostel">
<div class="header-title"><strong>Search</strong><span>Hostel Management</span></div>
</div>
<button class="profile-button" onclick="openProfile()"><i data-lucide="user-round"></i></button>
</header>

<main class="page">

<section class="card">
<div class="search-box">
<div class="search-wrap">
<i data-lucide="search"></i>
<input id="searchInput" type="search" placeholder="Search tenants, plans, payments..." autocomplete="off">
</div>
</div>
<div class="filters">
<button class="filter active" data-filter="all">All</button>
<button class="filter" data-filter="tenant">Tenants</button>
<button class="filter" data-filter="plan">Rent Plans</button>
<button class="filter" data-filter="payment">Payments</button>
</div>
</section>

<section class="card">
<div class="section-title">Search Results</div>
<div id="results"><div class="status">Loading records...</div></div>
<div id="empty" class="empty" style="display:none">
<i data-lucide="search-x"></i>
<div>No matching results found.</div>
</div>
<div id="error" class="status" style="display:none"></div>
</section>

<section class="card">
<div class="section-title">Quick Access</div>
<div class="quick-grid">
<button class="quick" onclick="goTo('tenants')"><i data-lucide="users-round"></i>Tenants</button>
<button class="quick" onclick="goTo('rent-plans')"><i data-lucide="receipt-text"></i>Rent Plans</button>
<button class="quick" onclick="goTo('summary')"><i data-lucide="chart-no-axes-combined"></i>Summary</button>
<button class="quick" onclick="goTo('action')"><i data-lucide="menu"></i>Actions</button>
</div>
</section>

</main>

<nav class="bottom-nav">
<button class="nav-item" onclick="goTo('rent-plans')"><span class="nav-icon"><i data-lucide="receipt-text"></i></span><span>Rent Plan</span></button>
<button class="nav-item" onclick="goTo('tenants')"><span class="nav-icon"><i data-lucide="users-round"></i></span><span>Tenant</span></button>
<button class="nav-item" onclick="goTo('summary')"><span class="nav-icon"><i data-lucide="chart-no-axes-combined"></i></span><span>Summary</span></button>
<button class="nav-item active" onclick="goTo('action')"><span class="nav-icon"><i data-lucide="menu"></i></span><span>Action</span></button>
</nav>

<script type="module">
import { auth, db } from "../js/firebase-config.js";
import {
  collection, getDocs
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const searchInput = document.getElementById("searchInput");
const resultsEl = document.getElementById("results");
const emptyEl = document.getElementById("empty");
const errorEl = document.getElementById("error");

let currentFilter = "all";
let records = [];
let loaded = false;

const escapeHTML = value => String(value ?? "").replace(/[&<>"']/g, char => ({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
}[char]));

function asText(value) {
  if (value === null || value === undefined) return "";
  if (typeof value === "object" && typeof value.toDate === "function") {
    return value.toDate().toLocaleDateString("en-IN");
  }
  if (typeof value === "object") return "";
  return String(value);
}

function money(value) {
  const amount = Number(value);
  return Number.isFinite(amount)
    ? "₹" + amount.toLocaleString("en-IN")
    : "";
}

function timestampValue(value) {
  if (!value) return 0;
  if (typeof value.toMillis === "function") return value.toMillis();
  if (typeof value.toDate === "function") return value.toDate().getTime();
  const parsed = new Date(value).getTime();
  return Number.isFinite(parsed) ? parsed : 0;
}

function addRecord(type, id, title, meta, searchable, url, icon, sortTime = 0) {
  records.push({
    type, id, title, meta, searchable: searchable.toLowerCase(),
    url, icon, sortTime
  });
}

async function loadRecords(user) {
  records = [];

  const [tenantSnap, planSnap, paymentSnap] = await Promise.all([
    getDocs(collection(db, "users", user.uid, "tenants")),
    getDocs(collection(db, "users", user.uid, "rentPlans")),
    getDocs(collection(db, "users", user.uid, "payments"))
  ]);

  const tenantsById = new Map();

  tenantSnap.forEach(docSnap => {
    const t = docSnap.data();
    const id = docSnap.id;
    const name = t.name || t.tenantName || "Unnamed tenant";
    const room = t.roomNumber ?? t.room ?? t.roomNo ?? "";
    const phone = t.phone ?? t.phoneNumber ?? t.mobile ?? "";
    const due = Number(t.currentDue ?? t.openingBalance ?? 0);
    const status = due > 0 ? "Due" : "Paid";

    tenantsById.set(id, { ...t, name, room, phone, due });

    const meta = [
      room !== "" ? "Room " + room : "",
      phone ? "Phone " + phone : "",
      status + (due > 0 ? " · " + money(due) : "")
    ].filter(Boolean).join(" · ");

    const searchable = [
      name, room, phone, t.email, t.address, t.status, status,
      due, money(due), "tenant tenants"
    ].map(asText).join(" ");

    addRecord(
      "tenant", id, name, meta, searchable,
      "../tenants/tenant-details.html?tenant=" + encodeURIComponent(id),
      "user-round", timestampValue(t.updatedAt || t.createdAt)
    );
  });

  planSnap.forEach(docSnap => {
    const p = docSnap.data();
    const id = docSnap.id;
    const name = p.name || p.planName || p.title || "Untitled rent plan";
    const amount = p.amount ?? p.rent ?? p.monthlyRent ?? p.price ?? "";
    const period = p.period || p.duration || p.frequency || "";
    const meta = [
      amount !== "" ? money(amount) : "",
      period ? asText(period) : ""
    ].filter(Boolean).join(" · ");

    const searchable = [
      name, amount, money(amount), period, p.description, p.type,
      p.status, "rent plan plans"
    ].map(asText).join(" ");

    addRecord(
      "plan", id, name, meta || "Rent plan",
      searchable, "../main/rent-plans.html",
      "receipt-text", timestampValue(p.updatedAt || p.createdAt)
    );
  });

  paymentSnap.forEach(docSnap => {
    const p = docSnap.data();
    const id = docSnap.id;
    const tenantId = p.tenantId || "";
    const tenant = tenantsById.get(tenantId);
    const tenantName = p.tenantName || (tenant && tenant.name) || "Unknown tenant";
    const amount = p.amount ?? p.paidAmount ?? 0;
    const date = p.date || p.paymentDate || p.createdAt;
    const method = p.method || p.paymentMethod || "";
    const note = p.note || p.notes || "";
    const dateText = asText(date);
    const meta = [
      money(amount),
      dateText,
      method,
      tenant ? "Room " + tenant.room : ""
    ].filter(Boolean).join(" · ");

    const searchable = [
      tenantName, tenantId, amount, money(amount), dateText,
      method, note, p.status, p.paymentStatus,
      tenant && tenant.room, tenant && tenant.phone,
      "payment payments paid due"
    ].map(asText).join(" ");

    addRecord(
      "payment", id, tenantName + " — " + money(amount),
      meta || "Payment record", searchable,
      tenantId
        ? "../tenants/tenant-details.html?tenant=" + encodeURIComponent(tenantId)
        : "../main/tenants.html",
      "indian-rupee", timestampValue(p.createdAt || date)
    );
  });

  records.sort((a, b) => b.sortTime - a.sortTime);
  loaded = true;
  renderResults();
}

function renderResults() {
  if (!loaded) return;

  const query = searchInput.value.toLowerCase().trim();
  const words = query.split(/\s+/).filter(Boolean);

  const filtered = records.filter(record => {
    const filterMatches = currentFilter === "all" || record.type === currentFilter;
    const textMatches = words.every(word => record.searchable.includes(word));
    return filterMatches && textMatches;
  });

  resultsEl.innerHTML = "";

  if (filtered.length === 0) {
    emptyEl.style.display = "block";
    resultsEl.style.display = "none";
  } else {
    emptyEl.style.display = "none";
    resultsEl.style.display = "block";

    filtered.slice(0, 100).forEach(record => {
      const item = document.createElement("div");
      item.className = "result";
      item.tabIndex = 0;
      item.setAttribute("role", "link");
      item.innerHTML = `
        <div class="result-icon"><i data-lucide="${record.icon}"></i></div>
        <div class="result-main">
          <div class="result-title">${escapeHTML(record.title)}</div>
          <div class="result-meta">${escapeHTML(record.meta)}</div>
        </div>
        <div class="result-arrow"><i data-lucide="chevron-right"></i></div>
      `;

      item.addEventListener("click", () => {
        window.location.href = record.url;
      });
      item.addEventListener("keydown", event => {
        if (event.key === "Enter" || event.key === " ") {
          event.preventDefault();
          window.location.href = record.url;
        }
      });

      resultsEl.appendChild(item);
    });

    if (filtered.length > 100) {
      const more = document.createElement("div");
      more.className = "status";
      more.textContent = "Showing the first 100 results. Refine your search to find more.";
      resultsEl.appendChild(more);
    }
  }

  lucide.createIcons();
}

document.querySelectorAll(".filter").forEach(button => {
  button.addEventListener("click", () => {
    document.querySelectorAll(".filter").forEach(item => item.classList.remove("active"));
    button.classList.add("active");
    currentFilter = button.dataset.filter;
    renderResults();
  });
});

searchInput.addEventListener("input", renderResults);

auth.onAuthStateChanged(async user => {
  loaded = false;
  resultsEl.style.display = "block";
  emptyEl.style.display = "none";
  errorEl.style.display = "none";

  if (!user) {
    records = [];
    resultsEl.innerHTML = '<div class="status">Please sign in to search your records.</div>';
    loaded = true;
    return;
  }

  resultsEl.innerHTML = '<div class="status">Loading records...</div>';

  try {
    await loadRecords(user);
  } catch (error) {
    console.error("Search loading error:", error);
    resultsEl.innerHTML = "";
    errorEl.style.display = "block";
    errorEl.textContent = "Could not load records. Check your connection and Firestore permissions, then refresh this page.";
  }
});

window.goTo = function(page) {
  const paths = {
    "rent-plans": "../main/rent-plans.html",
    "tenants": "../main/tenants.html",
    "summary": "../main/summary.html",
    "action": "../main/action.html"
  };
  if (paths[page]) window.location.href = paths[page];
};

window.openProfile = function() {
  window.location.href = "profile.html";
};

lucide.createIcons();
</script>
</body>
</html>
