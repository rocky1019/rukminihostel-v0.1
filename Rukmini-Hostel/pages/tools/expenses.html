
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Expenses - Rukmini Hostel</title>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#F5F7F6;color:#263238;padding-bottom:84px}
button,input,select,textarea{font:inherit}
.header{height:72px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;background:#00695C;border-bottom:1px solid #00574D;position:sticky;top:0;z-index:20}
.header-left{display:flex;align-items:center;gap:9px}
.back-button{width:34px;height:34px;border:0;background:transparent;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}
.back-button svg{width:21px;height:21px;stroke-width:2.5}
.header-logo{width:43px;height:43px;border-radius:12px;object-fit:cover;background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12)}
.header-title{display:flex;flex-direction:column;gap:3px}.header-title strong{font-size:17px;line-height:1;font-weight:700;color:#fff}.header-title span{font-size:11px;color:#B2DFDB}
.profile-button{width:40px;height:40px;border:1px solid #4DB6AC;border-radius:50%;background:#087D70;color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer}.profile-button svg{width:19px;height:19px}
.page{max-width:600px;margin:auto;padding:14px}
.card{background:#fff;border-radius:12px;box-shadow:0 3px 12px rgba(0,0,0,.09);margin-bottom:12px;overflow:hidden}
.summary{padding:16px}.summary-title{font-size:17px;font-weight:700;color:#00695C}.summary-text{font-size:12px;color:#777;margin-top:5px}
.summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:13px}.summary-box{border:1px solid #D7E5E3;border-radius:9px;padding:12px;background:#FAFCFB}.summary-box svg{width:19px;color:#00695C;margin-bottom:7px}.value{font-size:20px;font-weight:700}.label{font-size:11px;color:#777;margin-top:3px}
.section-title{color:#00695C;font-size:17px;font-weight:700;padding:14px 15px 11px;border-bottom:1px solid #E4EAEA}
.form{padding:14px}.field{margin-bottom:12px}.field:last-child{margin-bottom:0}label{display:block;font-size:12px;color:#666;margin-bottom:6px}
input,select,textarea{width:100%;border:1px solid #CFDDDB;border-radius:8px;background:#fff;color:#222;padding:12px 11px;outline:none}input:focus,select:focus,textarea:focus{border-color:#00897B}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.primary{width:100%;border:0;border-radius:9px;background:#00695C;color:#fff;padding:13px;font-weight:700;cursor:pointer}.primary:disabled{opacity:.65;cursor:wait}
.expense-row{padding:14px 15px;border-bottom:1px solid #EEF1F0;display:flex;align-items:center;gap:11px}.expense-row:last-child{border-bottom:0}.expense-icon{width:42px;height:42px;border-radius:10px;background:#E6F4F2;color:#00695C;display:flex;align-items:center;justify-content:center;flex:none}.expense-icon svg{width:20px}.expense-main{flex:1;min-width:0}.expense-name{font-size:14px;font-weight:700;overflow-wrap:anywhere}.expense-meta{font-size:11px;color:#777;margin-top:4px;overflow-wrap:anywhere}.expense-amount{font-size:14px;font-weight:700;color:#263238;white-space:nowrap}
.empty{padding:25px 15px;text-align:center;color:#777;font-size:13px}.empty svg{width:30px;height:30px;color:#80CBC4;margin-bottom:8px}
.bottom-nav{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:100%;max-width:600px;height:72px;background:#00695C;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px 10px;z-index:50;box-shadow:0 -4px 15px rgba(0,77,70,.12)}
.nav-item{border:0;background:transparent;color:#B2DFDB;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:10px;font-weight:500;cursor:pointer}.nav-icon{width:36px;height:30px;border-radius:10px;display:flex;align-items:center;justify-content:center}.nav-icon svg{width:18px;height:18px;stroke-width:2.6}.nav-item.active{color:#fff;font-weight:700}.nav-item.active .nav-icon{background:#80CBC4;color:#004D40}
@media(max-width:420px){.header{padding:0 16px}.page{padding:12px}.form-grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<header class="header">
<div class="header-left">
<button class="back-button" onclick="history.back()"><i data-lucide="arrow-left"></i></button>
<img src="../../assets/rukminilogo.png" class="header-logo" alt="Rukmini Hostel">
<div class="header-title"><strong>Expenses</strong><span>Hostel Management</span></div>
</div>
<button class="profile-button" onclick="openProfile()"><i data-lucide="user-round"></i></button>
</header>

<main class="page">

<section class="card summary">
<div class="summary-title">Expense Summary</div>
<div class="summary-text">Track hostel expenses and outgoing payments.</div>
<div class="summary-grid">
<div class="summary-box"><i data-lucide="wallet"></i><div class="value" id="monthlyTotal">₹0</div><div class="label">This Month</div></div>
<div class="summary-box"><i data-lucide="receipt"></i><div class="value" id="totalEntries">0</div><div class="label">Total Entries</div></div>
</div>
</section>

<section class="card">
<div class="section-title">Add Expense</div>
<div class="form">
<div class="field"><label for="title">Expense Name</label><input id="title" type="text" maxlength="150" placeholder="e.g. Electricity bill"></div>
<div class="form-grid">
<div class="field"><label for="amount">Amount</label><input id="amount" type="number" min="0.01" step="0.01" placeholder="₹ amount"></div>
<div class="field"><label for="date">Date</label><input id="date" type="date"></div>
</div>
<div class="field"><label for="category">Category</label><select id="category"><option value="">Select category</option><option>Electricity</option><option>Water</option><option>Maintenance</option><option>Food / Grocery</option><option>Internet</option><option>Staff</option><option>Rent / Property</option><option>Other</option></select></div>
<div class="field"><label for="notes">Notes</label><textarea id="notes" maxlength="1000" placeholder="Optional notes"></textarea></div>
<button class="primary" id="saveButton" type="button" onclick="saveExpense()">Save Expense</button>
</div>
</section>

<section class="card">
<div class="section-title">Recent Expenses</div>
<div id="expenseList">
<div class="empty"><i data-lucide="loader-circle"></i><div>Loading expenses...</div></div>
</div>
</section>

</main>

<nav class="bottom-nav">
<button class="nav-item" onclick="goTo('rent-plans')"><span class="nav-icon"><i data-lucide="receipt-text"></i></span><span>Rent Plan</span></button>
<button class="nav-item" onclick="goTo('tenants')"><span class="nav-icon"><i data-lucide="users-round"></i></span><span>Tenant</span></button>
<button class="nav-item" onclick="goTo('summary')"><span class="nav-icon"><i data-lucide="chart-no-axes-combined"></i></span><span>Summary</span></button>
<button class="nav-item active" onclick="goTo('action')"><span class="nav-icon"><i data-lucide="menu"></i></span><span>Action</span></button>
</nav>

<script type="module">
import { auth, db } from "../js/firebase-config.js";

import {
    collection,
    addDoc,
    getDocs,
    serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const titleInput = document.getElementById("title");
const amountInput = document.getElementById("amount");
const dateInput = document.getElementById("date");
const categoryInput = document.getElementById("category");
const notesInput = document.getElementById("notes");
const saveButton = document.getElementById("saveButton");
const expenseList = document.getElementById("expenseList");
const monthlyTotal = document.getElementById("monthlyTotal");
const totalEntries = document.getElementById("totalEntries");

let currentUser = null;
let expenses = [];
let saving = false;

const money = value =>
    Number(value || 0).toLocaleString("en-IN", {
        style: "currency",
        currency: "INR",
        maximumFractionDigits: 2
    });

function localDateString(date = new Date()) {
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, "0");
    const day = String(date.getDate()).padStart(2, "0");
    return `${year}-${month}-${day}`;
}

dateInput.value = localDateString();
dateInput.max = localDateString();

function showEmpty(message, icon = "receipt") {
    expenseList.replaceChildren();

    const empty = document.createElement("div");
    empty.className = "empty";

    const iconElement = document.createElement("i");
    iconElement.setAttribute("data-lucide", icon);

    const textElement = document.createElement("div");
    textElement.textContent = message;

    empty.append(iconElement, textElement);
    expenseList.appendChild(empty);

    lucide.createIcons();
}

function formatDate(value) {
    if (!value) return "Date not specified";

    const parts = String(value).split("-");
    if (parts.length !== 3) return value;

    const date = new Date(
        Number(parts[0]),
        Number(parts[1]) - 1,
        Number(parts[2])
    );

    return date.toLocaleDateString("en-IN", {
        day: "numeric",
        month: "short",
        year: "numeric"
    });
}

function getCategoryIcon(category) {
    const icons = {
        "Electricity": "zap",
        "Water": "droplets",
        "Maintenance": "wrench",
        "Food / Grocery": "shopping-cart",
        "Internet": "wifi",
        "Staff": "users",
        "Rent / Property": "building",
        "Other": "receipt"
    };

    return icons[category] || "receipt";
}

function renderExpenses() {
    const now = new Date();
    const currentMonth = `${now.getFullYear()}-${String(
        now.getMonth() + 1
    ).padStart(2, "0")}`;

    const monthTotal = expenses.reduce((total, expense) => {
        if (String(expense.date || "").startsWith(currentMonth)) {
            return total + Number(expense.amount || 0);
        }
        return total;
    }, 0);

    monthlyTotal.textContent = money(monthTotal);
    totalEntries.textContent = String(expenses.length);

    if (expenses.length === 0) {
        showEmpty("No expenses recorded yet.");
        return;
    }

    expenseList.replaceChildren();

    // Newest expenses first.
    const sortedExpenses = [...expenses].sort((a, b) => {
        const dateCompare = String(b.date || "").localeCompare(
            String(a.date || "")
        );

        if (dateCompare !== 0) return dateCompare;

        const timeA = a.createdAt?.seconds || 0;
        const timeB = b.createdAt?.seconds || 0;

        return timeB - timeA;
    });

    sortedExpenses.forEach(expense => {
        const row = document.createElement("div");
        row.className = "expense-row";

        const iconBox = document.createElement("div");
        iconBox.className = "expense-icon";

        const icon = document.createElement("i");
        icon.setAttribute(
            "data-lucide",
            getCategoryIcon(expense.category)
        );
        iconBox.appendChild(icon);

        const main = document.createElement("div");
        main.className = "expense-main";

        const name = document.createElement("div");
        name.className = "expense-name";
        name.textContent = expense.title || "Untitled expense";

        const meta = document.createElement("div");
        meta.className = "expense-meta";

        const details = [
            expense.category || "Other",
            formatDate(expense.date)
        ];

        if (expense.notes) details.push(expense.notes);

        meta.textContent = details.join(" · ");

        main.append(name, meta);

        const amount = document.createElement("div");
        amount.className = "expense-amount";
        amount.textContent = money(expense.amount);

        row.append(iconBox, main, amount);
        expenseList.appendChild(row);
    });

    lucide.createIcons();
}

async function loadExpenses() {
    if (!currentUser) return;

    showEmpty("Loading expenses...", "loader-circle");

    try {
        const expensesRef = collection(
            db,
            "users",
            currentUser.uid,
            "expenses"
        );

        const snapshot = await getDocs(expensesRef);

        expenses = snapshot.docs.map(documentSnapshot => ({
            id: documentSnapshot.id,
            ...documentSnapshot.data()
        }));

        renderExpenses();
    } catch (error) {
        console.error("Error loading expenses:", error);

        showEmpty(
            "Could not load expenses. Check your connection and try again.",
            "alert-circle"
        );

        // Keep the user able to retry without changing the page layout.
        const retry = document.createElement("button");
        retry.className = "primary";
        retry.style.margin = "0 14px 14px";
        retry.style.width = "calc(100% - 28px)";
        retry.textContent = "Retry";
        retry.addEventListener("click", loadExpenses);
        expenseList.appendChild(retry);
    }
}

async function saveExpense() {
    if (saving) return;

    const title = titleInput.value.trim();
    const amount = Number(amountInput.value);
    const date = dateInput.value;
    const category = categoryInput.value;
    const notes = notesInput.value.trim();

    if (!title || !amountInput.value || !Number.isFinite(amount) ||
        amount <= 0 || !category || !date) {
        alert("Please enter the expense name, a valid amount, date and category.");
        return;
    }

    if (date > localDateString()) {
        alert("Expense date cannot be in the future.");
        return;
    }

    if (!currentUser) {
        alert("Please sign in before saving an expense.");
        return;
    }

    saving = true;
    saveButton.disabled = true;
    saveButton.textContent = "Saving...";

    try {
        const expensesRef = collection(
            db,
            "users",
            currentUser.uid,
            "expenses"
        );

        const expenseData = {
            title,
            amount,
            date,
            category,
            notes,
            createdAt: serverTimestamp(),
            updatedAt: serverTimestamp()
        };

        const documentRef = await addDoc(expensesRef, expenseData);

        // Update the current screen immediately after Firestore confirms saving.
        expenses.push({
            id: documentRef.id,
            ...expenseData,
            createdAt: { seconds: Math.floor(Date.now() / 1000) }
        });

        renderExpenses();

        titleInput.value = "";
        amountInput.value = "";
        dateInput.value = localDateString();
        categoryInput.value = "";
        notesInput.value = "";

        alert("Expense saved successfully!");
    } catch (error) {
        console.error("Error saving expense:", error);

        if (error.code === "permission-denied") {
            alert("Firebase permission denied. Please check your Firestore security rules.");
        } else {
            alert("Could not save the expense. Please check your internet connection and try again.");
        }
    } finally {
        saving = false;
        saveButton.disabled = false;
        saveButton.textContent = "Save Expense";
    }
}

// Keep the existing page navigation working.
window.goTo = function(page) {
    if (page === "rent-plans") window.location.href = "../main/rent-plans.html";
    if (page === "tenants") window.location.href = "../main/tenants.html";
    if (page === "summary") window.location.href = "../main/summary.html";
    if (page === "action") window.location.href = "../main/action.html";
};

window.openProfile = function() {
    window.location.href = "profile.html";
};

window.saveExpense = saveExpense;

auth.onAuthStateChanged(user => {
    currentUser = user;

    if (!user) {
        expenses = [];
        monthlyTotal.textContent = money(0);
        totalEntries.textContent = "0";
        showEmpty("Please sign in to view expenses.", "user-round");
        return;
    }

    loadExpenses();
});

lucide.createIcons();
</script>
</body>
</html>
