
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#00695C">
    <title>Tenant Subscription - Rukmini Hostel</title>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #E9EEEE;
            color: #263238;
        }

        button, input, select {
            font-family: inherit;
        }

        .app {
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            margin: 0 auto;
            background: #F5F7F7;
        }

        .header {
            height: 72px;
            padding: 0 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #00695C;
            color: white;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .back-button {
            width: 42px;
            height: 42px;
            border: none;
            background: transparent;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .back-button svg {
            width: 23px;
            height: 23px;
            stroke-width: 2.5;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
        }

        .content {
            padding: 20px 16px 35px;
        }

        .profile-card {
            background: white;
            border-radius: 18px;
            padding: 22px 20px;
            text-align: center;
            border: 1px solid #E4EAEA;
            box-shadow: 0 4px 12px rgba(38,50,56,.04);
            margin-bottom: 16px;
        }

        .avatar {
            width: 65px;
            height: 65px;
            margin: 0 auto 11px;
            border-radius: 20px;
            background: #E0F2F1;
            color: #00695C;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            font-weight: 700;
        }

        .profile-card h1 {
            font-size: 20px;
            margin-bottom: 5px;
        }

        .profile-card p {
            font-size: 13px;
            color: #78909C;
        }

        .card {
            background: white;
            border: 1px solid #E4EAEA;
            border-radius: 17px;
            padding: 18px;
            margin-bottom: 14px;
            box-shadow: 0 3px 10px rgba(38,50,56,.035);
        }

        .card-title {
            font-size: 15px;
            font-weight: 700;
            color: #00695C;
            margin-bottom: 16px;
        }

        .field {
            margin-bottom: 14px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field label {
            display: block;
            font-size: 11px;
            color: #90A4AE;
            margin-bottom: 6px;
        }

        .field input,
        .field select {
            width: 100%;
            height: 45px;
            border: 1px solid #DDE5E5;
            border-radius: 11px;
            padding: 0 12px;
            outline: none;
            background: #FAFCFC;
            color: #37474F;
            font-size: 14px;
        }

        .field input:focus,
        .field select:focus {
            border-color: #80CBC4;
            box-shadow: 0 0 0 3px rgba(0,137,123,.07);
        }

        .status-box {
            background: #E0F2F1;
            border-radius: 14px;
            padding: 17px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .status-box span {
            font-size: 12px;
            color: #51736F;
        }

        .status-box strong {
            display: block;
            margin-top: 4px;
            font-size: 20px;
            color: #00897B;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-top: 5px;
        }

        .save-button,
        .cancel-button {
            flex: 1;
            height: 47px;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }

        .save-button {
            background: #00695C;
            color: white;
        }

        .cancel-button {
            background: #FFEBEE;
            color: #C62828;
        }

        .save-button:active,
        .cancel-button:active {
            transform: scale(.98);
        }

        .loading {
            text-align: center;
            padding: 35px 20px;
            color: #78909C;
            font-size: 14px;
        }

        .error {
            background: white;
            border-radius: 17px;
            padding: 35px 20px;
            text-align: center;
        }

        .error h3 {
            margin-bottom: 7px;
            color: #455A64;
        }

        .error p {
            color: #90A4AE;
            font-size: 13px;
        }

        .toast {
            position: fixed;
            left: 50%;
            bottom: 25px;
            transform: translate(-50%, 20px);
            background: #263238;
            color: white;
            padding: 11px 17px;
            border-radius: 10px;
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transition: .25s ease;
            z-index: 100;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* SUBSCRIPTION LIST */

        .subscription-list-toolbar {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 14px;
        }

        .subscription-list-toolbar input,
        .subscription-list-toolbar select {
            width: 100%;
            min-width: 0;
            height: 43px;
            padding: 0 12px;
            border: 1px solid #DDE5E5;
            border-radius: 10px;
            background: #FAFCFC;
            color: #37474F;
            font-size: 13px;
            outline: none;
        }

        .subscription-count {
            font-size: 12px;
            color: #78909C;
            margin-bottom: 12px;
        }

        .subscription-item {
            padding: 15px;
            border: 1px solid #E4EAEA;
            border-radius: 13px;
            margin-bottom: 11px;
            background: #FFFFFF;
        }

        .subscription-item:last-child {
            margin-bottom: 0;
        }

        .subscription-item-header {
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 12px;
        }

        .subscription-tenant-name {
            font-size: 14px;
            font-weight: 700;
            color: #263238;
            overflow-wrap: anywhere;
        }

        .subscription-room {
            font-size: 11px;
            color: #78909C;
            margin-top: 4px;
        }

        .subscription-badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            text-transform: capitalize;
            white-space: nowrap;
        }

        .subscription-badge.active {
            background: #E0F2F1;
            color: #00796B;
        }

        .subscription-badge.expired {
            background: #FFEBEE;
            color: #C62828;
        }

        .subscription-badge.paused {
            background: #FFF3E0;
            color: #E65100;
        }

        .subscription-plan {
            font-size: 13px;
            font-weight: 600;
            color: #455A64;
            margin-bottom: 12px;
            overflow-wrap: anywhere;
        }

        .subscription-meta {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 13px;
        }

        .subscription-meta-label {
            display: block;
            font-size: 10px;
            color: #90A4AE;
            margin-bottom: 4px;
        }

        .subscription-meta-value {
            font-size: 12px;
            font-weight: 600;
            color: #37474F;
            overflow-wrap: anywhere;
        }

        .subscription-edit-button {
            width: 100%;
            height: 38px;
            border: 1px solid #B2DFDB;
            border-radius: 9px;
            background: #E0F2F1;
            color: #00695C;
            font-size: 12px;
            font-weight: 700;
            cursor: pointer;
        }

        .subscription-edit-button:active {
            transform: scale(.98);
        }

        .subscription-empty {
            text-align: center;
            padding: 25px 12px;
            color: #78909C;
            font-size: 13px;
            line-height: 1.6;
        }

        .subscription-error {
            color: #C62828;
            background: #FFEBEE;
            padding: 12px;
            border-radius: 10px;
            font-size: 12px;
            line-height: 1.5;
        }
    </style>
</head>

<body>
<div class="app">
    <header class="header">
        <button class="back-button" onclick="goBack()">
            <i data-lucide="arrow-left"></i>
        </button>
        <div class="header-title">Tenant Subscription</div>
    </header>

    <main class="content">
        <div id="loading" class="loading">
            Loading subscription...
        </div>

        <div id="tenantContent" style="display:none;">
            <section class="profile-card">
                <div class="avatar" id="avatar">TN</div>
                <h1 id="tenantName">—</h1>
                <p id="tenantRoom">—</p>
            </section>

            <section class="card">
                <div class="card-title">Subscription Status</div>

                <div class="status-box">
                    <div>
                        <span>Current Status</span>
                        <strong id="statusText">Active</strong>
                    </div>
                    <i data-lucide="badge-check"
                       style="width:25px;height:25px;color:#00897B;"></i>
                </div>

                <div class="field">
                    <label>Status</label>
                    <select id="subscriptionStatus">
                        <option value="active">Active</option>
                        <option value="expired">Expired</option>
                        <option value="paused">Paused</option>
                    </select>
                </div>
            </section>

            <section class="card">
                <div class="card-title">Subscription Details</div>

                <div class="field">
                    <label>Plan / Subscription Name</label>
                    <input type="text" id="subscriptionName"
                           placeholder="e.g. Monthly Hostel Plan">
                </div>

                <div class="field">
                    <label>Amount</label>
                    <input type="number" id="subscriptionAmount"
                           placeholder="0">
                </div>

                <div class="field">
                    <label>Start Date</label>
                    <input type="date" id="subscriptionStart">
                </div>

                <div class="field">
                    <label>Renewal / Expiry Date</label>
                    <input type="date" id="subscriptionEnd">
                </div>
            </section>

            <section class="card">
                <div class="card-title">Actions</div>
                <div class="actions">
                    <button class="save-button"
                            onclick="saveSubscription()">Save</button>
                    <button class="cancel-button"
                            onclick="clearSubscription()">Cancel</button>
                </div>
            </section>

            <!-- ALL SUBSCRIPTIONS -->
            <section class="card subscription-list-card">
                <div class="card-title">All Subscriptions</div>

                <div class="subscription-list-toolbar">
                    <input type="search" id="subscriptionSearch"
                           placeholder="Search tenant or plan...">

                    <select id="subscriptionFilter">
                        <option value="all">All Statuses</option>
                        <option value="active">Active</option>
                        <option value="expired">Expired</option>
                        <option value="paused">Paused</option>
                    </select>
                </div>

                <div id="subscriptionCount" class="subscription-count">
                    Loading subscriptions...
                </div>

                <div id="subscriptionList">
                    <div class="loading">Loading subscriptions...</div>
                </div>
            </section>
        </div>

        <div id="errorState" class="error" style="display:none;">
            <h3>Unable to load tenant</h3>
            <p id="errorMessage">Something went wrong.</p>
        </div>
    </main>
</div>

<div class="toast" id="toast"></div>

<script type="module">
    import { auth, db } from "../js/firebase-config.js";

    import {
        doc,
        getDoc,
        updateDoc,
        collection,
        getDocs
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

    lucide.createIcons();

    /* URL / BACK */

    const params = new URLSearchParams(window.location.search);
    const tenantId = params.get("tenant");

    function goBack() {
        window.location.href =
            "../tenants/tenant-details.html?tenant=" +
            encodeURIComponent(tenantId);
    }

    window.goBack = goBack;

    /* HELPERS */

    function getInitials(name) {
        if (!name) return "TN";

        const words = name.trim().split(/\s+/).filter(Boolean);

        if (words.length === 1) {
            return words[0].substring(0, 2).toUpperCase();
        }

        return (words[0][0] + words[1][0]).toUpperCase();
    }

    function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");

        setTimeout(() => {
            toast.classList.remove("show");
        }, 2200);
    }

    /* LOAD TENANT */

    async function loadTenant() {
        const loading = document.getElementById("loading");
        const content = document.getElementById("tenantContent");
        const errorState = document.getElementById("errorState");

        if (!tenantId) {
            loading.style.display = "none";
            errorState.style.display = "block";
            document.getElementById("errorMessage").textContent =
                "No tenant ID was provided.";
            return;
        }

        const user = auth.currentUser;

        if (!user) {
            loading.style.display = "none";
            errorState.style.display = "block";
            document.getElementById("errorMessage").textContent =
                "Please log in first.";
            return;
        }

        try {
            const tenantRef = doc(
                db, "users", user.uid, "tenants", tenantId
            );

            const snapshot = await getDoc(tenantRef);

            if (!snapshot.exists()) {
                throw new Error("This tenant does not exist.");
            }

            const tenant = snapshot.data();
            const name = tenant.name || "Unnamed Tenant";

            const room = tenant.buildingNumber
                ? (
                    tenant.building
                        ? tenant.building + " • " + tenant.buildingNumber
                        : tenant.buildingNumber
                )
                : (tenant.building || "No room assigned");

            document.getElementById("avatar").textContent =
                getInitials(name);

            document.getElementById("tenantName").textContent = name;
            document.getElementById("tenantRoom").textContent = room;

            /* SUBSCRIPTION DATA */

            const subscription = tenant.subscription || {};

            document.getElementById("subscriptionName").value =
                subscription.name || "";

            document.getElementById("subscriptionAmount").value =
                subscription.amount ?? "";

            document.getElementById("subscriptionStart").value =
                subscription.startDate || "";

            document.getElementById("subscriptionEnd").value =
                subscription.endDate || "";

            const status = subscription.status || "active";

            document.getElementById("subscriptionStatus").value = status;
            updateStatusText(status);

            loading.style.display = "none";
            content.style.display = "block";

            await loadSubscriptionList();
            lucide.createIcons();

        } catch (error) {
            console.error(error);

            loading.style.display = "none";
            errorState.style.display = "block";

            document.getElementById("errorMessage").textContent =
                error.message || "Something went wrong.";
        }
    }

    /* STATUS */

    function updateStatusText(status) {
        const text = document.getElementById("statusText");

        if (status === "expired") {
            text.textContent = "Expired";
            text.style.color = "#D84343";
        } else if (status === "paused") {
            text.textContent = "Paused";
            text.style.color = "#EF8C00";
        } else {
            text.textContent = "Active";
            text.style.color = "#00897B";
        }
    }

    document.getElementById("subscriptionStatus")
        .addEventListener("change", function () {
            updateStatusText(this.value);
        });

    /* SAVE */

    async function saveSubscription() {
        const user = auth.currentUser;

        if (!user || !tenantId) {
            showToast("Unable to save subscription.");
            return;
        }

        const subscription = {
            name: document.getElementById("subscriptionName").value.trim(),
            amount: Number(
                document.getElementById("subscriptionAmount").value
            ) || 0,
            startDate: document.getElementById("subscriptionStart").value,
            endDate: document.getElementById("subscriptionEnd").value,
            status: document.getElementById("subscriptionStatus").value
        };

        try {
            const tenantRef = doc(
                db, "users", user.uid, "tenants", tenantId
            );

            await updateDoc(tenantRef, {
                subscription: subscription
            });

            updateStatusText(subscription.status);
            showToast("Subscription saved");

            await loadSubscriptionList();

        } catch (error) {
            console.error("Subscription save error:", error);
            showToast(error.message || "Unable to save.");
        }
    }

    window.saveSubscription = saveSubscription;

    /* CLEAR / CANCEL */

    async function clearSubscription() {
        const user = auth.currentUser;

        if (!user || !tenantId) return;

        try {
            const tenantRef = doc(
                db, "users", user.uid, "tenants", tenantId
            );

            await updateDoc(tenantRef, {
                subscription: null
            });

            document.getElementById("subscriptionName").value = "";
            document.getElementById("subscriptionAmount").value = "";
            document.getElementById("subscriptionStart").value = "";
            document.getElementById("subscriptionEnd").value = "";
            document.getElementById("subscriptionStatus").value = "active";

            updateStatusText("active");
            showToast("Subscription removed");

            await loadSubscriptionList();

        } catch (error) {
            console.error(error);
            showToast(error.message || "Unable to remove subscription.");
        }
    }

    window.clearSubscription = clearSubscription;

    /* ALL SUBSCRIPTIONS LIST */

    let allSubscriptions = [];

    function escapeSubscriptionHTML(value) {
        return String(value ?? "").replace(/[&<>"']/g, char => ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;"
        })[char]);
    }

    function formatSubscriptionDate(value) {
        if (!value) return "Not set";

        const parts = String(value).split("-");

        if (parts.length !== 3) return value;

        return `${parts[2]}/${parts[1]}/${parts[0]}`;
    }

    function formatSubscriptionAmount(value) {
        return "₹" + Number(value || 0).toLocaleString("en-IN");
    }

    async function loadSubscriptionList() {
        const list = document.getElementById("subscriptionList");
        const count = document.getElementById("subscriptionCount");

        if (!list || !count) return;

        const user = auth.currentUser;

        if (!user) {
            list.innerHTML = `
                <div class="subscription-empty">
                    Please log in to view subscriptions.
                </div>
            `;
            count.textContent = "";
            return;
        }

        list.innerHTML = `
            <div class="loading">Loading subscriptions...</div>
        `;

        try {
            const tenantsRef = collection(
                db, "users", user.uid, "tenants"
            );

            const snapshot = await getDocs(tenantsRef);
            allSubscriptions = [];

            snapshot.forEach(tenantDoc => {
                const tenant = tenantDoc.data();
                const sub = tenant.subscription;

                if (
                    !sub ||
                    typeof sub !== "object" ||
                    !sub.name?.trim()
                ) {
                    return;
                }

                allSubscriptions.push({
                    id: tenantDoc.id,
                    tenantName: tenant.name || "Unnamed Tenant",

                    room: tenant.buildingNumber
                        ? (
                            tenant.building
                                ? `${tenant.building} • ${tenant.buildingNumber}`
                                : tenant.buildingNumber
                        )
                        : (tenant.building || "No room assigned"),

                    name: sub.name,
                    amount: Number(sub.amount || 0),
                    startDate: sub.startDate || "",
                    endDate: sub.endDate || "",

                    status: ["active", "expired", "paused"].includes(
                        String(sub.status || "active").toLowerCase()
                    )
                        ? String(sub.status || "active").toLowerCase()
                        : "active"
                });
            });

            allSubscriptions.sort((a, b) => {
                if (!a.endDate) return 1;
                if (!b.endDate) return -1;
                return a.endDate.localeCompare(b.endDate);
            });

            renderSubscriptionList();

        } catch (error) {
            console.error("Subscription list error:", error);

            list.innerHTML = `
                <div class="subscription-error">
                    Unable to load subscriptions.
                    ${escapeSubscriptionHTML(error.message)}
                </div>
            `;

            count.textContent = "";
        }
    }

    function renderSubscriptionList() {
        const list = document.getElementById("subscriptionList");
        const count = document.getElementById("subscriptionCount");

        const search = (
            document.getElementById("subscriptionSearch").value || ""
        ).trim().toLowerCase();

        const filter =
            document.getElementById("subscriptionFilter").value;

        const filtered = allSubscriptions.filter(sub => {
            const matchesSearch =
                sub.tenantName.toLowerCase().includes(search) ||
                sub.name.toLowerCase().includes(search) ||
                String(sub.room).toLowerCase().includes(search);

            const matchesStatus =
                filter === "all" || sub.status === filter;

            return matchesSearch && matchesStatus;
        });

        count.textContent =
            `${filtered.length} subscription${filtered.length === 1 ? "" : "s"}`;

        if (filtered.length === 0) {
            list.innerHTML = `
                <div class="subscription-empty">
                    <strong>No subscriptions found</strong><br>
                    ${
                        allSubscriptions.length === 0
                            ? "Save a subscription using the form above. It will appear here."
                            : "Try changing your search or status filter."
                    }
                </div>
            `;
            return;
        }

        list.innerHTML = filtered.map(sub => `
            <article class="subscription-item">

                <div class="subscription-item-header">
                    <div>
                        <div class="subscription-tenant-name">
                            ${escapeSubscriptionHTML(sub.tenantName)}
                        </div>

                        <div class="subscription-room">
                            ${escapeSubscriptionHTML(sub.room)}
                        </div>
                    </div>

                    <span class="subscription-badge ${sub.status}">
                        ${escapeSubscriptionHTML(sub.status)}
                    </span>
                </div>

                <div class="subscription-plan">
                    ${escapeSubscriptionHTML(sub.name)}
                </div>

                <div class="subscription-meta">
                    <div>
                        <span class="subscription-meta-label">Amount</span>
                        <span class="subscription-meta-value">
                            ${formatSubscriptionAmount(sub.amount)}
                        </span>
                    </div>

                    <div>
                        <span class="subscription-meta-label">Start Date</span>
                        <span class="subscription-meta-value">
                            ${escapeSubscriptionHTML(
                                formatSubscriptionDate(sub.startDate)
                            )}
                        </span>
                    </div>

                    <div>
                        <span class="subscription-meta-label">
                            Renewal / Expiry
                        </span>
                        <span class="subscription-meta-value">
                            ${escapeSubscriptionHTML(
                                formatSubscriptionDate(sub.endDate)
                            )}
                        </span>
                    </div>
                </div>

                <button
                    type="button"
                    class="subscription-edit-button"
                    data-tenant-id="${escapeSubscriptionHTML(sub.id)}"
                >
                    Edit Subscription
                </button>

            </article>
        `).join("");

        list.querySelectorAll(".subscription-edit-button")
            .forEach(button => {
                button.addEventListener("click", () => {
                    const id = button.dataset.tenantId;
                    const url = new URL(window.location.href);

                    url.searchParams.set("tenant", id);

                    window.location.href = url.pathname + url.search;
                });
            });
    }

    document.getElementById("subscriptionSearch")
        .addEventListener("input", renderSubscriptionList);

    document.getElementById("subscriptionFilter")
        .addEventListener("change", renderSubscriptionList);

    /* AUTH */

    if (auth.currentUser) {
        loadTenant();
    } else {
        auth.onAuthStateChanged(function (user) {
            if (user) {
                loadTenant();
            }
        });
    }
</script>
</body>
</html>
