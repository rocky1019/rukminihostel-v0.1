<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#00695C">

    <title>Tenant Documents - Rukmini Hostel</title>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #E9EEEE;
            color: #263238;
        }

        button,
        input {
            font-family: inherit;
        }

        .app {
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            margin: 0 auto;
            background: #F5F7F7;
            box-shadow: 0 0 35px rgba(0,0,0,.05);
        }

        /* HEADER */

        .header {
            height: 72px;
            padding: 0 18px;
            display: flex;
            align-items: center;
            gap: 12px;
            background: #00695C;
            color: white;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .back-button {
            width: 42px;
            height: 42px;
            border: none;
            background: transparent;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .back-button svg {
            width: 23px;
            height: 23px;
            stroke-width: 2.5;
        }

        .header-title {
            font-size: 20px;
            font-weight: 700;
        }

        /* CONTENT */

        .content {
            padding: 20px 16px 40px;
        }

        /* TENANT */

        .tenant-card {
            background: white;
            border: 1px solid #E4EAEA;
            border-radius: 17px;
            padding: 17px;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 13px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            flex-shrink: 0;
            border-radius: 14px;
            background: #E0F2F1;
            color: #00695C;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
        }

        .tenant-info {
            min-width: 0;
        }

        .tenant-info strong {
            display: block;
            font-size: 15px;
            margin-bottom: 5px;
            color: #263238;
        }

        .tenant-info span {
            font-size: 12px;
            color: #78909C;
        }

        /* UPLOAD */

        .upload-button {
            width: 100%;
            height: 52px;
            border: none;
            border-radius: 13px;
            background: #00695C;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 9px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 5px 14px rgba(0,105,92,.18);
            margin-bottom: 22px;
        }

        .upload-button svg {
            width: 20px;
            height: 20px;
        }

        .upload-button:active {
            transform: scale(.98);
        }

        #fileInput {
            display: none;
        }

        /* SECTION */

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 11px;
        }

        .section-title strong {
            font-size: 14px;
            color: #455A64;
        }

        .section-title span {
            font-size: 12px;
            color: #90A4AE;
        }

        /* DOCUMENT */

        .document-card {
            background: white;
            border: 1px solid #E4EAEA;
            border-radius: 16px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .document-icon {
            width: 45px;
            height: 45px;
            flex-shrink: 0;
            border-radius: 12px;
            background: #E0F2F1;
            color: #00695C;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .document-icon svg {
            width: 21px;
            height: 21px;
        }

        .document-info {
            flex: 1;
            min-width: 0;
        }

        .document-info strong {
            display: block;
            font-size: 13px;
            color: #37474F;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 5px;
        }

        .document-info span {
            font-size: 10px;
            color: #90A4AE;
        }

        .document-actions {
            display: flex;
            gap: 6px;
        }

        .document-action {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 9px;
            background: #F7F9F9;
            color: #607D8B;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .document-action svg {
            width: 17px;
            height: 17px;
        }

        .document-action.delete {
            color: #C62828;
        }

        /* EMPTY */

        .empty-state {
            background: white;
            border: 1px dashed #D5DEDE;
            border-radius: 17px;
            padding: 42px 20px;
            text-align: center;
        }

        .empty-icon {
            width: 58px;
            height: 58px;
            margin: 0 auto 15px;
            border-radius: 17px;
            background: #E0F2F1;
            color: #00695C;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .empty-icon svg {
            width: 25px;
            height: 25px;
        }

        .empty-state h3 {
            font-size: 16px;
            margin-bottom: 6px;
            color: #455A64;
        }

        .empty-state p {
            font-size: 12px;
            line-height: 1.5;
            color: #90A4AE;
            max-width: 270px;
            margin: auto;
        }

        /* LOADING */

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #78909C;
            font-size: 14px;
        }

        /* TOAST */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 25px;
            transform: translate(-50%, 20px);
            background: #263238;
            color: white;
            padding: 11px 17px;
            border-radius: 10px;
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transition: .25s ease;
            z-index: 100;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

    </style>

</head>


<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <button
            class="back-button"
            onclick="goBack()"
        >
            <i data-lucide="arrow-left"></i>
        </button>

        <div class="header-title">
            Tenant Documents
        </div>

    </header>


    <main class="content">

        <div id="loading" class="loading">
            Loading tenant...
        </div>


        <div id="pageContent" style="display:none;">

            <!-- TENANT -->

            <section class="tenant-card">

                <div
                    class="avatar"
                    id="avatar"
                >
                    TN
                </div>

                <div class="tenant-info">

                    <strong id="tenantName">
                        —
                    </strong>

                    <span id="tenantRoom">
                        —
                    </span>

                </div>

            </section>


            <!-- UPLOAD -->

            <input
                type="file"
                id="fileInput"
                accept=".pdf,.jpg,.jpeg,.png"
            >

            <button
                class="upload-button"
                onclick="chooseDocument()"
            >
                <i data-lucide="upload"></i>
                Upload Document
            </button>


            <!-- DOCUMENTS -->

            <div class="section-title">

                <strong>
                    Documents
                </strong>

                <span id="documentCount">
                    0 documents
                </span>

            </div>


            <div id="documentsContainer"></div>

        </div>

    </main>

</div>


<div
    class="toast"
    id="toast"
></div>


<script type="module">

    import {
        auth,
        db
    } from "../js/firebase-config.js";

    import {
        doc,
        getDoc,
        collection,
        getDocs,
        addDoc,
        deleteDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    /* =====================================================
       LUCIDE
       ===================================================== */

    lucide.createIcons();


    /* =====================================================
       GET TENANT ID
       ===================================================== */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const tenantId =
        params.get("tenant");


    /* =====================================================
       BACK
       ===================================================== */

    function goBack() {

        window.location.href =
            "tenant-details.html?tenant=" +
            encodeURIComponent(tenantId);

    }

    window.goBack = goBack;


    /* =====================================================
       INITIALS
       ===================================================== */

    function getInitials(name) {

        if (!name) return "TN";

        const words =
            name.trim()
                .split(/\s+/)
                .filter(Boolean);

        if (words.length === 1) {

            return words[0]
                .substring(0, 2)
                .toUpperCase();

        }

        return (
            words[0][0] +
            words[1][0]
        ).toUpperCase();

    }


    /* =====================================================
       TOAST
       ===================================================== */

    function showToast(message) {

        const toast =
            document.getElementById("toast");

        toast.textContent =
            message;

        toast.classList.add("show");

        setTimeout(() => {

            toast.classList.remove("show");

        }, 2200);

    }


    /* =====================================================
       LOAD TENANT
       ===================================================== */

    async function loadTenant() {

        const user =
            auth.currentUser;

        if (!user || !tenantId) {

            showToast(
                "Unable to identify tenant."
            );

            return;

        }

        try {

            const tenantRef =
                doc(
                    db,
                    "users",
                    user.uid,
                    "tenants",
                    tenantId
                );

            const snapshot =
                await getDoc(
                    tenantRef
                );

            if (!snapshot.exists()) {

                throw new Error(
                    "Tenant not found."
                );

            }

            const tenant =
                snapshot.data();

            const name =
                tenant.name ||
                "Unnamed Tenant";

            const room =
                tenant.buildingNumber
                    ? (
                        tenant.building
                            ? tenant.building +
                              " • " +
                              tenant.buildingNumber
                            : tenant.buildingNumber
                      )
                    : (
                        tenant.building ||
                        "No room assigned"
                      );


            document.getElementById(
                "avatar"
            ).textContent =
                getInitials(name);


            document.getElementById(
                "tenantName"
            ).textContent =
                name;


            document.getElementById(
                "tenantRoom"
            ).textContent =
                room;


            document.getElementById(
                "loading"
            ).style.display =
                "none";


            document.getElementById(
                "pageContent"
            ).style.display =
                "block";


            await loadDocuments();


        } catch (error) {

            console.error(error);

            document.getElementById(
                "loading"
            ).textContent =
                error.message ||
                "Unable to load tenant.";

        }

    }


    /* =====================================================
       LOAD DOCUMENTS
       ===================================================== */

    async function loadDocuments() {

        const user =
            auth.currentUser;

        const container =
            document.getElementById(
                "documentsContainer"
            );

        const count =
            document.getElementById(
                "documentCount"
            );


        container.innerHTML = "";


        const documentsRef =
            collection(
                db,
                "users",
                user.uid,
                "tenants",
                tenantId,
                "documents"
            );


        const snapshot =
            await getDocs(
                documentsRef
            );


        count.textContent =
            snapshot.size +
            (
                snapshot.size === 1
                    ? " document"
                    : " documents"
            );


        if (snapshot.empty) {

            container.innerHTML = `

                <section class="empty-state">

                    <div class="empty-icon">
                        <i data-lucide="file-text"></i>
                    </div>

                    <h3>
                        No documents yet
                    </h3>

                    <p>
                        Upload tenant documents such as
                        ID proof, agreements or other records.
                    </p>

                </section>

            `;

            lucide.createIcons();

            return;

        }


        snapshot.forEach(function(documentSnapshot) {

            const data =
                documentSnapshot.data();

            const documentId =
                documentSnapshot.id;

            const name =
                data.name ||
                "Document";


            const date =
                data.createdAt?.toDate
                    ? data.createdAt
                        .toDate()
                        .toLocaleDateString("en-IN")
                    : "Recently added";


            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "document-card";


            card.innerHTML = `

                <div class="document-icon">

                    <i data-lucide="file-text"></i>

                </div>


                <div class="document-info">

                    <strong>
                        ${escapeHtml(name)}
                    </strong>

                    <span>
                        ${escapeHtml(date)}
                    </span>

                </div>


                <div class="document-actions">

                    ${
                        data.url
                            ? `
                                <button
                                    class="document-action"
                                    onclick="openDocument('${encodeURIComponent(data.url)}')"
                                >
                                    <i data-lucide="external-link"></i>
                                </button>
                              `
                            : ""
                    }


                    <button
                        class="document-action delete"
                        onclick="removeDocument('${documentId}')"
                    >
                        <i data-lucide="trash-2"></i>
                    </button>

                </div>

            `;


            container.appendChild(card);

        });


        lucide.createIcons();

    }


    /* =====================================================
       CHOOSE FILE
       ===================================================== */

    function chooseDocument() {

        document
            .getElementById("fileInput")
            .click();

    }

    window.chooseDocument =
        chooseDocument;


    /* =====================================================
       FILE SELECTED
       ===================================================== */

    document
        .getElementById("fileInput")
        .addEventListener(
            "change",
            async function(event) {

                const file =
                    event.target.files[0];

                if (!file) {
                    return;
                }


                const allowedTypes = [
                    "application/pdf",
                    "image/jpeg",
                    "image/png"
                ];


                if (
                    !allowedTypes.includes(
                        file.type
                    )
                ) {

                    showToast(
                        "Only PDF, JPG and PNG files are allowed."
                    );

                    event.target.value = "";

                    return;

                }


                /*
                 * For now we save the document
                 * information in Firestore.
                 *
                 * Firebase Storage can be connected
                 * here once your firebase-config.js
                 * exports the Storage instance.
                 */

                try {

                    const user =
                        auth.currentUser;


                    const documentsRef =
                        collection(
                            db,
                            "users",
                            user.uid,
                            "tenants",
                            tenantId,
                            "documents"
                        );


                    await addDoc(
                        documentsRef,
                        {
                            name: file.name,
                            type: file.type,
                            size: file.size,
                            createdAt:
                                serverTimestamp()
                        }
                    );


                    showToast(
                        "Document added successfully."
                    );


                    event.target.value = "";


                    await loadDocuments();


                } catch (error) {

                    console.error(
                        "Document upload error:",
                        error
                    );

                    showToast(
                        "Could not add document."
                    );

                }

            }
        );


    /* =====================================================
       OPEN DOCUMENT
       ===================================================== */

    function openDocument(encodedUrl) {

        const url =
            decodeURIComponent(
                encodedUrl
            );

        window.open(
            url,
            "_blank"
        );

    }

    window.openDocument =
        openDocument;


    /* =====================================================
       DELETE DOCUMENT
       ===================================================== */

    async function removeDocument(documentId) {

        const confirmed =
            confirm(
                "Delete this document?"
            );

        if (!confirmed) {
            return;
        }


        try {

            const user =
                auth.currentUser;


            const documentRef =
                doc(
                    db,
                    "users",
                    user.uid,
                    "tenants",
                    tenantId,
                    "documents",
                    documentId
                );


            await deleteDoc(
                documentRef
            );


            showToast(
                "Document deleted."
            );


            await loadDocuments();


        } catch (error) {

            console.error(error);

            showToast(
                "Could not delete document."
            );

        }

    }

    window.removeDocument =
        removeDocument;


    /* =====================================================
       ESCAPE HTML
       ===================================================== */

    function escapeHtml(value) {

        return String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    /* =====================================================
       AUTH
       ===================================================== */

    if (auth.currentUser) {

        loadTenant();

    } else {

        auth.onAuthStateChanged(
            function(user) {

                if (user) {

                    loadTenant();

                }

            }
        );

    }

</script>

</body>

</html>
