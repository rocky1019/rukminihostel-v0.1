<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#00695C">

    <title>Tenant Balance - Rukmini Hostel</title>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #E9EEEE;
            color: #263238;
            overflow-x: hidden;
            padding-bottom: 76px;
        }

        button,
        input,
        textarea {
            font-family: inherit;
        }

        button {
            -webkit-appearance: none;
        }

        .app {
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            margin: 0 auto;
            background: #F5F7F7;
            position: relative;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.04);
        }

        /* HEADER */

        .header {
            height: 72px;
            padding: 0 16px;
            display: flex;
            align-items: center;
            background: #00695C;
            border-bottom: 1px solid #00574D;
            position: sticky;
            top: 0;
            z-index: 20;
        }

        .back-button {
            width: 40px;
            height: 40px;
            border: none;
            background: transparent;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
        }

        .back-button svg {
            width: 23px;
            height: 23px;
            stroke-width: 2.5;
        }

        .header-title {
            margin-left: 8px;
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .header-title strong {
            font-size: 17px;
            color: #FFFFFF;
        }

        .header-title span {
            font-size: 11px;
            color: #B2DFDB;
        }

        .profile-button {
            width: 40px;
            height: 40px;
            margin-left: auto;
            border: 1px solid #4DB6AC;
            border-radius: 50%;
            background: #087D70;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .profile-button svg {
            width: 19px;
            height: 19px;
            stroke-width: 2.6;
        }

        /* CONTENT */

        .content {
            padding: 20px 18px 100px;
        }

        /* TENANT HEADER */

        .tenant-summary {
            background: white;
            border: 1px solid #E1E9E8;
            border-radius: 17px;
            padding: 17px;
            display: flex;
            align-items: center;
            gap: 13px;
            margin-bottom: 16px;
            box-shadow: 0 3px 10px rgba(38, 50, 56, 0.035);
        }

        .tenant-avatar {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            background: #E0F2F1;
            color: #00695C;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 700;
            flex-shrink: 0;
        }

        .tenant-info {
            min-width: 0;
        }

        .tenant-info strong {
            display: block;
            font-size: 16px;
            color: #263238;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tenant-info span {
            display: block;
            margin-top: 5px;
            font-size: 12px;
            color: #78909C;
        }

        /* BALANCE HERO */

        .balance-card {
            background: #00695C;
            color: white;
            border-radius: 18px;
            padding: 22px;
            margin-bottom: 15px;
            box-shadow: 0 7px 18px rgba(0, 105, 92, 0.18);
        }

        .balance-label {
            font-size: 12px;
            color: #B2DFDB;
            margin-bottom: 7px;
        }

        .balance-amount {
            font-size: 35px;
            font-weight: 700;
            line-height: 1.1;
        }

        .balance-status {
            margin-top: 9px;
            font-size: 12px;
            color: #E0F2F1;
        }

        /* ACTIONS */

        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-bottom: 20px;
        }

        .action-button {
            height: 50px;
            border-radius: 13px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
        }

        .action-button svg {
            width: 18px;
            height: 18px;
        }

        .payment-button {
            background: #00695C;
            color: white;
        }

        .add-balance-button {
            background: white;
            color: #00695C;
            border: 1px solid #80CBC4;
        }

        /* STATS */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 22px;
        }

        .stat {
            background: white;
            border: 1px solid #E4EAEA;
            border-radius: 14px;
            padding: 14px 10px;
        }

        .stat span {
            display: block;
            font-size: 10px;
            color: #90A4AE;
            margin-bottom: 7px;
        }

        .stat strong {
            font-size: 15px;
            color: #455A64;
        }

        /* SECTION */

        .section-title {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .section-title strong {
            font-size: 15px;
            color: #455A64;
        }

        /* HISTORY */

        .history-card {
            background: white;
            border: 1px solid #E4EAEA;
            border-radius: 16px;
            overflow: hidden;
        }

        .history-item {
            padding: 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid #EDF0F0;
        }

        .history-item:last-child {
            border-bottom: none;
        }

        .history-left {
            display: flex;
            align-items: center;
            gap: 11px;
        }

        .history-icon {
            width: 38px;
            height: 38px;
            border-radius: 11px;
            background: #E0F2F1;
            color: #00695C;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .history-icon svg {
            width: 18px;
            height: 18px;
        }

        .history-info strong {
            display: block;
            font-size: 13px;
            color: #455A64;
        }

        .history-info span {
            display: block;
            margin-top: 4px;
            font-size: 10px;
            color: #90A4AE;
        }

        .history-amount {
            font-size: 14px;
            font-weight: 700;
            color: #00695C;
        }

        .empty-history {
            padding: 30px 20px;
            text-align: center;
            color: #90A4AE;
            font-size: 12px;
        }

        /* ADD BALANCE MODAL */

        .modal {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.42);
            z-index: 100;
            display: none;
            align-items: flex-end;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-box {
            width: 100%;
            max-width: 600px;
            background: white;
            border-radius: 20px 20px 0 0;
            padding: 22px 18px 28px;
        }

        .modal-title {
            font-size: 19px;
            font-weight: 700;
            color: #263238;
            margin-bottom: 17px;
        }

        .modal-label {
            display: block;
            font-size: 12px;
            color: #78909C;
            margin-bottom: 7px;
        }

        .modal-input {
            width: 100%;
            height: 52px;
            border: 1px solid #B0BEC5;
            border-radius: 11px;
            outline: none;
            padding: 0 14px;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .modal-input:focus {
            border-color: #00695C;
        }

        .modal-actions {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .modal-actions button {
            height: 48px;
            border-radius: 11px;
            border: none;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .cancel-button {
            background: #F1F4F4;
            color: #546E7A;
        }

        .save-button {
            background: #00695C;
            color: white;
        }

        /* TOAST */

        .toast {
            position: fixed;
            left: 50%;
            bottom: 90px;
            transform: translate(-50%, 20px);
            background: #263238;
            color: white;
            padding: 11px 17px;
            border-radius: 10px;
            font-size: 12px;
            opacity: 0;
            pointer-events: none;
            transition: .25s ease;
            z-index: 200;
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translate(-50%, 0);
        }

        /* BOTTOM NAV */

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            height: 76px;
            background: #00695C;
            border-top: 1px solid #00574D;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            padding: 8px 8px 10px;
            z-index: 50;
            box-shadow: 0 -4px 15px rgba(0, 77, 70, 0.12);
        }

        .nav-item {
            border: none;
            background: transparent;
            color: #B2DFDB;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 10px;
            font-weight: 500;
            cursor: pointer;
        }

        .nav-icon {
            width: 36px;
            height: 30px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .nav-icon svg {
            width: 18px;
            height: 18px;
            stroke-width: 2.6;
        }

        @media (max-width: 360px) {

            .content {
                padding-left: 14px;
                padding-right: 14px;
            }

            .balance-amount {
                font-size: 31px;
            }

            .stats {
                gap: 7px;
            }

            .stat {
                padding-left: 8px;
                padding-right: 8px;
            }

            .stat strong {
                font-size: 13px;
            }
        }

    </style>

</head>


<body>

<div class="app">

    <!-- HEADER -->

    <header class="header">

        <button
            class="back-button"
            onclick="goBack()"
            aria-label="Back"
        >
            <i data-lucide="arrow-left"></i>
        </button>

        <div class="header-title">

            <strong>Tenant Balance</strong>

            <span>Rukmini Hostel • Rent Management</span>

        </div>

        <button
            class="profile-button"
            onclick="openProfile()"
        >
            <i data-lucide="user-round"></i>
        </button>

    </header>


    <!-- CONTENT -->

    <main class="content">

        <!-- TENANT -->

        <section class="tenant-summary">

            <div
                class="tenant-avatar"
                id="tenantAvatar"
            >
                TN
            </div>

            <div class="tenant-info">

                <strong id="tenantName">
                    Loading...
                </strong>

                <span id="tenantRoom">
                    Loading tenant details...
                </span>

            </div>

        </section>


        <!-- CURRENT BALANCE -->

        <section class="balance-card">

            <div class="balance-label">
                Current Balance
            </div>

            <div
                class="balance-amount"
                id="currentBalance"
            >
                ₹0
            </div>

            <div
                class="balance-status"
                id="balanceStatus"
            >
                Loading...
            </div>

        </section>


        <!-- ACTIONS -->

        <div class="action-row">

            <button
                class="action-button payment-button"
                onclick="collectPayment()"
            >
                <i data-lucide="wallet"></i>
                Collect Payment
            </button>

            <button
                class="action-button add-balance-button"
                onclick="openAddBalance()"
            >
                <i data-lucide="plus"></i>
                Add Balance
            </button>

        </div>


        <!-- STATS -->

        <section class="stats">

            <div class="stat">

                <span>
                    Opening Balance
                </span>

                <strong id="openingBalance">
                    ₹0
                </strong>

            </div>


            <div class="stat">

                <span>
                    Total Paid
                </span>

                <strong id="totalPaid">
                    ₹0
                </strong>

            </div>


            <div class="stat">

                <span>
                    Balance Type
                </span>

                <strong id="balanceType">
                    —
                </strong>

            </div>

        </section>


        <!-- HISTORY -->

        <div class="section-title">

            <strong>
                Balance History
            </strong>

        </div>


        <section class="history-card">

            <div id="historyContainer">

                <div class="empty-history">
                    Loading balance history...
                </div>

            </div>

        </section>

    </main>


    <!-- BOTTOM NAV -->

    <nav class="bottom-nav">

        <button
            class="nav-item"
            onclick="goTo('rent-plans')"
        >
            <span class="nav-icon">
                <i data-lucide="receipt-text"></i>
            </span>

            <span>Rent Plan</span>
        </button>


        <button
            class="nav-item active"
            onclick="goTo('tenants')"
        >
            <span class="nav-icon">
                <i data-lucide="users-round"></i>
            </span>

            <span>Tenant</span>
        </button>


        <button
            class="nav-item"
            onclick="goTo('summary')"
        >
            <span class="nav-icon">
                <i data-lucide="chart-no-axes-combined"></i>
            </span>

            <span>Summary</span>
        </button>


        <button
            class="nav-item"
            onclick="goTo('action')"
        >
            <span class="nav-icon">
                <i data-lucide="menu"></i>
            </span>

            <span>Action</span>
        </button>

    </nav>

</div>


<!-- ADD BALANCE MODAL -->

<div
    class="modal"
    id="balanceModal"
>

    <div class="modal-box">

        <div class="modal-title">
            Add Balance
        </div>


        <label class="modal-label">
            Amount
        </label>

        <input
            type="number"
            id="balanceAmount"
            class="modal-input"
            placeholder="₹ Amount"
            min="1"
        >


        <label class="modal-label">
            Note
        </label>

        <input
            type="text"
            id="balanceNote"
            class="modal-input"
            placeholder="Reason or note"
        >


        <div class="modal-actions">

            <button
                class="cancel-button"
                onclick="closeAddBalance()"
            >
                Cancel
            </button>

            <button
                class="save-button"
                onclick="saveBalance()"
            >
                Add Balance
            </button>

        </div>

    </div>

</div>


<!-- TOAST -->

<div
    class="toast"
    id="toast"
></div>


<script type="module">

    import {
        auth,
        db
    } from "../js/firebase-config.js";

    import {
        doc,
        getDoc,
        collection,
        addDoc,
        getDocs,
        updateDoc,
        increment,
        serverTimestamp,
        query,
        orderBy
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    /* =====================================================
       INITIALIZE
       ===================================================== */

    lucide.createIcons();


    /* =====================================================
       TENANT ID
       ===================================================== */

    const params =
        new URLSearchParams(
            window.location.search
        );

    const tenantId =
        params.get("tenant");


    let tenantData = null;


    /* =====================================================
       HELPERS
       ===================================================== */

    function formatMoney(amount) {

        return "₹" +
            (Number(amount) || 0)
                .toLocaleString("en-IN");

    }


    function getInitials(name) {

        if (!name) {
            return "TN";
        }

        const words =
            name.trim()
                .split(/\s+/)
                .filter(Boolean);

        if (words.length === 1) {

            return words[0]
                .substring(0, 2)
                .toUpperCase();

        }

        return (
            words[0][0] +
            words[1][0]
        ).toUpperCase();

    }


    function escapeHtml(value) {

        return String(value ?? "")
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");

    }


    function formatDate(value) {

        if (!value) {
            return "Unknown date";
        }

        let date;

        if (
            typeof value === "object" &&
            value.seconds
        ) {

            date =
                new Date(
                    value.seconds * 1000
                );

        } else {

            date =
                new Date(value);

        }

        if (
            Number.isNaN(
                date.getTime()
            )
        ) {

            return "Unknown date";

        }

        return date.toLocaleDateString(
            "en-IN",
            {
                day: "2-digit",
                month: "short",
                year: "numeric"
            }
        );

    }


    /* =====================================================
       BACK
       ===================================================== */

    function goBack() {

        if (tenantId) {

            window.location.href =
                "tenant-details.html?tenant=" +
                encodeURIComponent(tenantId);

        } else {

            window.location.href =
                "../main/tenants.html";

        }

    }

    window.goBack = goBack;


    /* =====================================================
       PROFILE
       ===================================================== */

    function openProfile() {

        window.location.href =
            "../tools/profile.html";

    }

    window.openProfile = openProfile;


    /* =====================================================
       NAVIGATION
       ===================================================== */

    function goTo(page) {

        if (page === "rent-plans") {

            window.location.href =
                "../main/rent-plans.html";

            return;

        }

        if (page === "tenants") {

            window.location.href =
                "../main/tenants.html";

            return;

        }

        if (page === "summary") {

            window.location.href =
                "../main/summary.html";

            return;

        }

        if (page === "action") {

            window.location.href =
                "../main/action.html";

            return;

        }

    }

    window.goTo = goTo;


    /* =====================================================
       LOAD TENANT
       ===================================================== */

    async function loadTenant() {

        if (!tenantId) {

            showError(
                "No tenant selected."
            );

            return;

        }


        const user =
            auth.currentUser;


        if (!user) {

            showError(
                "Please log in first."
            );

            return;

        }


        try {

            const tenantRef =
                doc(
                    db,
                    "users",
                    user.uid,
                    "tenants",
                    tenantId
                );


            const snapshot =
                await getDoc(
                    tenantRef
                );


            if (!snapshot.exists()) {

                showError(
                    "Tenant not found."
                );

                return;

            }


            tenantData =
                snapshot.data();


            renderTenant();


            await loadHistory();

        } catch (error) {

            console.error(
                "Error loading tenant:",
                error
            );

            showError(
                error.message ||
                "Unable to load tenant."
            );

        }

    }


    /* =====================================================
       RENDER TENANT
       ===================================================== */

    function renderTenant() {

        const name =
            tenantData.name ||
            "Unnamed Tenant";


        const room =
            tenantData.buildingNumber
                ? (
                    tenantData.building
                        ? tenantData.building +
                          " • " +
                          tenantData.buildingNumber
                        : tenantData.buildingNumber
                  )
                : (
                    tenantData.building ||
                    "No room assigned"
                  );


        const balance =
            Number(
                tenantData.currentDue ??
                tenantData.openingBalance ??
                0
            );


        const opening =
            Number(
                tenantData.openingBalance ||
                0
            );


        const totalPaid =
            Number(
                tenantData.totalPaid ||
                0
            );


        const type =
            tenantData.balanceType === "owner"
                ? "Owner pays"
                : "Tenant owes";


        document.getElementById(
            "tenantName"
        ).textContent =
            name;


        document.getElementById(
            "tenantRoom"
        ).textContent =
            room;


        document.getElementById(
            "tenantAvatar"
        ).textContent =
            getInitials(name);


        document.getElementById(
            "currentBalance"
        ).textContent =
            formatMoney(balance);


        document.getElementById(
            "openingBalance"
        ).textContent =
            formatMoney(opening);


        document.getElementById(
            "totalPaid"
        ).textContent =
            formatMoney(totalPaid);


        document.getElementById(
            "balanceType"
        ).textContent =
            type;


        const status =
            document.getElementById(
                "balanceStatus"
            );


        if (balance <= 0) {

            status.textContent =
                "No outstanding balance";

        } else if (
            tenantData.balanceType === "owner"
        ) {

            status.textContent =
                "Amount payable to tenant";

        } else {

            status.textContent =
                "Amount due from tenant";

        }

    }


    /* =====================================================
       BALANCE HISTORY
       ===================================================== */

    async function loadHistory() {

        const container =
            document.getElementById(
                "historyContainer"
            );


        const user =
            auth.currentUser;


        if (!user || !tenantId) {
            return;
        }


        try {

            const historyRef =
                collection(
                    db,
                    "users",
                    user.uid,
                    "tenants",
                    tenantId,
                    "balanceHistory"
                );


            let snapshot;


            try {

                const historyQuery =
                    query(
                        historyRef,
                        orderBy(
                            "createdAt",
                            "desc"
                        )
                    );


                snapshot =
                    await getDocs(
                        historyQuery
                    );

            } catch (error) {

                snapshot =
                    await getDocs(
                        historyRef
                    );

            }


            if (snapshot.empty) {

                container.innerHTML = `
                    <div class="empty-history">
                        No balance history yet.
                    </div>
                `;

                return;

            }


            container.innerHTML = "";


            snapshot.forEach(
                function(historyDoc) {

                    const item =
                        historyDoc.data();


                    const amount =
                        Number(
                            item.amount || 0
                        );


                    const note =
                        item.note ||
                        "Balance added";


                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "history-item";


                    div.innerHTML = `

                        <div class="history-left">

                            <div class="history-icon">
                                <i data-lucide="plus"></i>
                            </div>

                            <div class="history-info">

                                <strong>
                                    Balance Added
                                </strong>

                                <span>
                                    ${escapeHtml(note)}
                                    •
                                    ${formatDate(item.createdAt)}
                                </span>

                            </div>

                        </div>

                        <div class="history-amount">
                            +${formatMoney(amount)}
                        </div>

                    `;


                    container.appendChild(
                        div
                    );

                }
            );


            lucide.createIcons();

        } catch (error) {

            console.error(
                "Error loading balance history:",
                error
            );


            container.innerHTML = `
                <div class="empty-history">
                    Unable to load balance history.
                </div>
            `;

        }

    }


    /* =====================================================
       ADD BALANCE MODAL
       ===================================================== */

    function openAddBalance() {

        document.getElementById(
            "balanceAmount"
        ).value = "";


        document.getElementById(
            "balanceNote"
        ).value = "";


        document.getElementById(
            "balanceModal"
        ).classList.add(
            "show"
        );


        setTimeout(
            function() {

                document.getElementById(
                    "balanceAmount"
                ).focus();

            },
            100
        );

    }

    window.openAddBalance =
        openAddBalance;


    function closeAddBalance() {

        document.getElementById(
            "balanceModal"
        ).classList.remove(
            "show"
        );

    }

    window.closeAddBalance =
        closeAddBalance;


    /* =====================================================
       SAVE BALANCE
       ===================================================== */

    async function saveBalance() {

        const amount =
            Number(
                document.getElementById(
                    "balanceAmount"
                ).value
            );


        const note =
            document.getElementById(
                "balanceNote"
            ).value.trim();


        if (!amount || amount <= 0) {

            showToast(
                "Enter a valid amount."
            );

            return;

        }


        const user =
            auth.currentUser;


        if (!user || !tenantId) {

            showToast(
                "Tenant could not be found."
            );

            return;

        }


        const saveButton =
            document.querySelector(
                ".save-button"
            );


        saveButton.disabled =
            true;

        saveButton.textContent =
            "Saving...";


        try {

            const tenantRef =
                doc(
                    db,
                    "users",
                    user.uid,
                    "tenants",
                    tenantId
                );


            /*
             * Increase the tenant's current due.
             */

            await updateDoc(
                tenantRef,
                {

                    currentDue:
                        increment(amount),

                    updatedAt:
                        serverTimestamp()

                }
            );


            /*
             * Store a permanent
             * balance history record.
             */

            const historyRef =
                collection(
                    db,
                    "users",
                    user.uid,
                    "tenants",
                    tenantId,
                    "balanceHistory"
                );


            await addDoc(
                historyRef,
                {

                    amount:
                        amount,

                    note:
                        note ||
                        "Balance added",

                    createdAt:
                        serverTimestamp()

                }
            );


            /*
             * Update local data immediately.
             */

            tenantData.currentDue =
                Number(
                    tenantData.currentDue ??
                    tenantData.openingBalance ??
                    0
                ) + amount;


            renderTenant();


            closeAddBalance();


            await loadHistory();


            showToast(
                "Balance added successfully."
            );


        } catch (error) {

            console.error(
                "Error adding balance:",
                error
            );


            showToast(
                error.message ||
                "Could not add balance."
            );

        } finally {

            saveButton.disabled =
                false;

            saveButton.textContent =
                "Add Balance";

        }

    }

    window.saveBalance =
        saveBalance;


    /* =====================================================
       COLLECT PAYMENT
       ===================================================== */

    function collectPayment() {

        if (!tenantId) {
            return;
        }


        window.location.href =
            "tenant-payment.html?tenant=" +
            encodeURIComponent(tenantId);

    }

    window.collectPayment =
        collectPayment;


    /* =====================================================
       ERROR
       ===================================================== */

    function showError(message) {

        document.getElementById(
            "tenantName"
        ).textContent =
            "Unable to load";


        document.getElementById(
            "tenantRoom"
        ).textContent =
            message;


        document.getElementById(
            "balanceStatus"
        ).textContent =
            message;


        document.getElementById(
            "historyContainer"
        ).innerHTML = `
            <div class="empty-history">
                ${escapeHtml(message)}
            </div>
        `;

    }


    /* =====================================================
       AUTH
       ===================================================== */

    if (auth.currentUser) {

        loadTenant();

    } else {

        auth.onAuthStateChanged(
            function(user) {

                if (user) {

                    loadTenant();

                } else {

                    showError(
                        "Please log in first."
                    );

                }

            }
        );

    }

</script>

</body>
</html>
