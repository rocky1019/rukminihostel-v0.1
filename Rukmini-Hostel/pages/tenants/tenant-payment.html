<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tenant Payments - Rukmini Hostel</title>
<script src="https://unpkg.com/lucide@latest"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{
    font-family:Arial,Helvetica,sans-serif;
    background:#F5F7F6;
    color:#263238;
    padding-bottom:84px;
}
button,input,select,textarea{font:inherit}

/* MASTER HEADER */
.header{
    height:72px;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:#00695C;
    border-bottom:1px solid #00574D;
    position:sticky;
    top:0;
    z-index:20;
}
.header-left{display:flex;align-items:center;gap:9px}
.back-button{
    width:34px;height:34px;border:0;background:transparent;color:#fff;
    display:flex;align-items:center;justify-content:center;cursor:pointer
}
.back-button svg{width:21px;height:21px;stroke-width:2.5}
.header-logo{
    width:43px;height:43px;border-radius:12px;object-fit:cover;
    background:#fff;box-shadow:0 4px 12px rgba(0,0,0,.12)
}
.header-title{display:flex;flex-direction:column;gap:3px}
.header-title strong{font-size:17px;line-height:1;font-weight:700;color:#fff}
.header-title span{font-size:11px;color:#B2DFDB}
.profile-button{
    width:40px;height:40px;border:1px solid #4DB6AC;border-radius:50%;
    background:#087D70;color:#fff;display:flex;align-items:center;
    justify-content:center;cursor:pointer
}
.profile-button svg{width:19px;height:19px}

/* PAGE */
.page{max-width:600px;margin:auto;padding:14px 14px 25px}

/* TENANT */
.tenant-card{
    background:#fff;border-radius:12px;padding:15px;
    box-shadow:0 3px 12px rgba(0,0,0,.10);
    display:flex;align-items:center;gap:13px;margin-bottom:12px
}
.tenant-avatar{
    width:52px;height:52px;border-radius:50%;
    background:#E0F2F1;color:#00695C;
    display:flex;align-items:center;justify-content:center
}
.tenant-avatar svg{width:23px}
.tenant-info{flex:1}
.tenant-name{font-size:18px;font-weight:700}
.tenant-meta{font-size:12px;color:#777;margin-top:4px}

/* BALANCE */
.balance-card{
    background:#fff;border-radius:12px;padding:17px;
    box-shadow:0 3px 12px rgba(0,0,0,.10);margin-bottom:12px
}
.balance-top{display:flex;justify-content:space-between;align-items:flex-start}
.balance-label{font-size:12px;color:#777}
.balance-value{font-size:27px;font-weight:700;color:#D48700;margin-top:5px}
.due-text{font-size:12px;color:#B66E00;margin-top:4px}
.pay-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.primary-btn,.outline-btn{
    min-height:43px;border-radius:9px;cursor:pointer;
    display:flex;align-items:center;justify-content:center;gap:7px;
    font-size:14px;font-weight:700
}
.primary-btn{border:0;background:#00695C;color:#fff}
.outline-btn{border:1px solid #80CBC4;background:#fff;color:#00695C}
.primary-btn svg,.outline-btn svg{width:17px}

/* SECTIONS */
.section{
    background:#fff;border-radius:11px;overflow:hidden;
    box-shadow:0 3px 11px rgba(0,0,0,.09);margin-bottom:12px
}
.section-title{
    color:#00695C;font-size:17px;font-weight:700;
    padding:14px 15px 11px;border-bottom:1px solid #E4EAEA
}
.form{padding:14px}
.field{margin-bottom:12px}
.field:last-child{margin-bottom:0}
label{display:block;font-size:12px;color:#666;margin-bottom:6px}
input,select,textarea{
    width:100%;border:1px solid #CFDDDB;border-radius:8px;
    background:#fff;color:#222;padding:12px 11px;outline:none
}
input:focus,select:focus,textarea:focus{border-color:#00897B}
textarea{min-height:78px;resize:vertical}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.save-payment{
    width:100%;margin-top:4px;border:0;border-radius:9px;
    background:#00695C;color:#fff;padding:13px;font-weight:700;cursor:pointer
}

/* QUICK TOOLS */
.tools-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px;padding:13px}
.tool{
    border:1px solid #D7E5E3;background:#fff;border-radius:9px;
    padding:13px 10px;text-align:left;color:#00695C;cursor:pointer;
    display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600
}
.tool svg{width:19px;flex:none}

/* HISTORY */
.payment-row{
    padding:14px 15px;border-bottom:1px solid #EEF1F0;
    display:flex;align-items:center;gap:11px
}
.payment-row:last-child{border-bottom:0}
.payment-icon{
    width:39px;height:39px;border-radius:10px;background:#E6F4F2;
    color:#00695C;display:flex;align-items:center;justify-content:center
}
.payment-icon svg{width:18px}
.payment-main{flex:1}
.payment-title{font-size:14px;font-weight:700}
.payment-meta{font-size:11px;color:#777;margin-top:4px}
.payment-amount{font-size:15px;font-weight:700;color:#087532}
.status-text{font-size:11px;color:#087532;margin-top:3px}

/* EMPTY */
.empty{
    padding:25px 15px;text-align:center;color:#777;font-size:13px
}
.empty svg{width:30px;height:30px;color:#80CBC4;margin-bottom:8px}

/* BOTTOM NAV */
.bottom-nav{
    position:fixed;left:50%;bottom:0;transform:translateX(-50%);
    width:100%;max-width:600px;height:72px;background:#00695C;
    display:grid;grid-template-columns:repeat(4,1fr);
    padding:8px 8px 10px;z-index:50;
    box-shadow:0 -4px 15px rgba(0,77,70,.12)
}
.nav-item{
    border:0;background:transparent;color:#B2DFDB;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:4px;font-size:10px;font-weight:500;cursor:pointer
}
.nav-icon{
    width:36px;height:30px;border-radius:10px;
    display:flex;align-items:center;justify-content:center
}
.nav-icon svg{width:18px;height:18px;stroke-width:2.6}
.nav-item.active{color:#fff;font-weight:700}
.nav-item.active .nav-icon{background:#80CBC4;color:#004D40}

@media(max-width:420px){
    .header{padding:0 16px}
    .page{padding-left:12px;padding-right:12px}
    .form-grid{grid-template-columns:1fr}
    .balance-value{font-size:25px}
}
</style>
</head>

<body>

<header class="header">
    <div class="header-left">
        <button class="back-button" onclick="history.back()" aria-label="Go back">
            <i data-lucide="arrow-left"></i>
        </button>

        <img src="../../assets/rukminilogo.png" class="header-logo" alt="Rukmini Hostel">

        <div class="header-title">
            <strong>Tenant Payments</strong>
            <span>Rent Management</span>
        </div>
    </div>

    <button class="profile-button" onclick="openProfile()" aria-label="Profile">
        <i data-lucide="user-round"></i>
    </button>
</header>

<main class="page">

    <section class="tenant-card">
        <div class="tenant-avatar"><i data-lucide="user-round"></i></div>
        <div class="tenant-info">
            <div class="tenant-name">Tenant Name</div>
            <div class="tenant-meta">Tenant Code: — &nbsp; • &nbsp; Room: —</div>
        </div>
    </section>

    <section class="balance-card">
        <div class="balance-top">
            <div>
                <div class="balance-label">Current Balance Due</div>
                <div class="balance-value">₹0</div>
                <div class="due-text">No pending amount</div>
            </div>
            <i data-lucide="wallet" style="color:#00695C;width:25px;height:25px"></i>
        </div>

        <div class="pay-actions">
            <button class="primary-btn" onclick="document.getElementById('paymentForm').scrollIntoView({behavior:'smooth'})">
                <i data-lucide="indian-rupee"></i> Collect Payment
            </button>
            <button class="outline-btn" onclick="alert('Payment link will be connected later.')">
                <i data-lucide="link"></i> Payment Link
            </button>
        </div>
    </section>

    <section class="section" id="paymentForm">
        <div class="section-title">Record Payment</div>

        <div class="form">
            <div class="field">
                <label for="amount">Payment Amount</label>
                <input id="amount" type="number" min="0" placeholder="Enter amount">
            </div>

            <div class="form-grid">
                <div class="field">
                    <label for="date">Payment Date</label>
                    <input id="date" type="date">
                </div>

                <div class="field">
                    <label for="method">Payment Method</label>
                    <select id="method">
                        <option value="">Select method</option>
                        <option>Cash</option>
                        <option>UPI</option>
                        <option>Bank Transfer</option>
                        <option>Cheque</option>
                        <option>Other</option>
                    </select>
                </div>
            </div>

            <div class="field">
                <label for="reference">Reference / Transaction ID</label>
                <input id="reference" type="text" placeholder="Optional">
            </div>

            <div class="field">
                <label for="notes">Notes</label>
                <textarea id="notes" placeholder="Add payment notes"></textarea>
            </div>

            <button class="save-payment" onclick="savePayment()">
                Save Payment
            </button>
        </div>
    </section>

    <section class="section">
        <div class="section-title">Payment Actions</div>

        <div class="tools-grid">
            <button class="tool" onclick="alert('Advance payment will be connected later.')">
                <i data-lucide="wallet-cards"></i>
                Advance Payment
            </button>

            <button class="tool" onclick="alert('Receipt sharing will be connected later.')">
                <i data-lucide="receipt-text"></i>
                Receipt Share
            </button>

            <button class="tool" onclick="alert('Bill sharing will be connected later.')">
                <i data-lucide="file-share"></i>
                Bill Share
            </button>

            <button class="tool" onclick="alert('Reminder sharing will be connected later.')">
                <i data-lucide="bell-ring"></i>
                Payment Reminder
            </button>
        </div>
    </section>

    <section class="section">
        <div class="section-title">Payment History</div>

        <div class="empty">
            <i data-lucide="receipt"></i>
            <div>No payments recorded yet.</div>
            <div style="font-size:11px;margin-top:4px">
                Payments will appear here after they are added.
            </div>
        </div>
    </section>

</main>

<nav class="bottom-nav">
    <button class="nav-item" onclick="goTo('rent-plans')">
        <span class="nav-icon"><i data-lucide="receipt-text"></i></span>
        <span>Rent Plan</span>
    </button>

    <button class="nav-item active" onclick="goTo('tenants')">
        <span class="nav-icon"><i data-lucide="users-round"></i></span>
        <span>Tenant</span>
    </button>

    <button class="nav-item" onclick="goTo('summary')">
        <span class="nav-icon"><i data-lucide="chart-no-axes-combined"></i></span>
        <span>Summary</span>
    </button>

    <button class="nav-item" onclick="goTo('action')">
        <span class="nav-icon"><i data-lucide="menu"></i></span>
        <span>Action</span>
    </button>
</nav>

<script>
lucide.createIcons();

function goTo(page){
    if(page === "rent-plans") window.location.href="../main/rent-plans.html";
    if(page === "tenants") window.location.href="../main/tenants.html";
    if(page === "summary") window.location.href="../main/summary.html";
    if(page === "action") window.location.href="../main/action.html";
}

function openProfile(){
    window.location.href="../tools/profile.html";
}

function savePayment(){
    const amount = document.getElementById("amount").value;

    if(!amount || Number(amount) <= 0){
        alert("Please enter a payment amount.");
        return;
    }

    alert("Payment saved locally for now. Firebase will handle real payments later.");
}
</script>

</body>
</html>
