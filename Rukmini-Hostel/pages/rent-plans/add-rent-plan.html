<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Rent Plan - Rukmini Hostel</title>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f6f8f7;
            color: #202020;
            min-height: 100vh;
        }

        /* ================= HEADER ================= */

        .header {
            height: 82px;
            background: #006b60;
            color: white;
            display: flex;
            align-items: center;
            padding: 0 18px;
            gap: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }

        .back-btn {
            width: 44px;
            height: 44px;
            border: none;
            background: transparent;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .back-btn i {
            width: 29px;
            height: 29px;
            stroke-width: 2.5;
        }

        .header-title {
            font-size: 25px;
            font-weight: 600;
        }

        /* ================= CONTENT ================= */

        .content {
            padding: 18px 14px 110px;
            max-width: 650px;
            margin: auto;
        }

        .section-card {
            background: white;
            border-radius: 12px;
            margin-bottom: 18px;
            padding: 16px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.10);
            border-left: 4px solid #008b7d;
        }

        .section-title {
            color: #008b7d;
            font-size: 17px;
            font-weight: 600;
            margin-bottom: 14px;
        }

        .divider {
            height: 1px;
            background: #e0e0e0;
            margin-bottom: 16px;
        }

        /* ================= INPUTS ================= */

        .field {
            margin-bottom: 18px;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field-label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #555;
            margin-bottom: 7px;
        }

        .required {
            color: #e53935;
        }

        input,
        select {
            width: 100%;
            height: 52px;
            border: 1.5px solid #aeb9b6;
            border-radius: 9px;
            padding: 0 15px;
            font-size: 18px;
            color: #222;
            background: white;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        select:focus {
            border-color: #008b7d;
            box-shadow: 0 0 0 3px rgba(0,139,125,0.10);
        }

        input::placeholder {
            color: #999;
        }

        /* ================= RATE ================= */

        .rate-box {
            background: white;
            border: 1.5px solid #aeb9b6;
            border-radius: 10px;
            padding: 15px;
        }

        .rate-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .rate-label {
            font-size: 17px;
            font-weight: 500;
        }

        .rate-colon {
            font-size: 20px;
            font-weight: 600;
        }

        .rate-input {
            width: 150px;
            height: 42px;
            border: none;
            border-bottom: 2px solid #777;
            border-radius: 0;
            padding: 0 4px;
            font-size: 20px;
        }

        .rate-input:focus {
            box-shadow: none;
            border-color: #008b7d;
        }

        /* ================= GST ================= */

        .gst-select-wrap {
            position: relative;
        }

        .gst-select {
            appearance: none;
            padding-right: 45px;
        }

        .select-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #666;
        }

        /* ================= PREVIEW ================= */

        .preview {
            display: none;
            background: #eef9f6;
            border: 1px solid #b9ded7;
            border-radius: 10px;
            padding: 15px;
            margin-top: 18px;
        }

        .preview.show {
            display: block;
        }

        .preview-title {
            color: #006b60;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .preview-row {
            display: flex;
            justify-content: space-between;
            margin: 7px 0;
            font-size: 15px;
        }

        .preview-total {
            border-top: 1px solid #b9ded7;
            margin-top: 10px;
            padding-top: 10px;
            font-weight: 700;
            font-size: 17px;
        }

        /* ================= SAVE ================= */

        .bottom-save {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 72px;
            background: #006b60;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }

        .save-btn {
            width: 100%;
            height: 100%;
            border: none;
            background: transparent;
            color: white;
            font-size: 21px;
            font-weight: 500;
            letter-spacing: 0.3px;
            cursor: pointer;
        }

        .save-btn:active {
            background: rgba(0,0,0,0.08);
        }

        /* ================= MODAL ================= */

        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.55);
            z-index: 100;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-overlay.show {
            display: flex;
        }

        .modal {
            background: white;
            width: 100%;
            max-width: 380px;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.25);
        }

        .modal h3 {
            color: #006b60;
            margin-bottom: 10px;
            font-size: 21px;
        }

        .modal p {
            color: #666;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
        }

        .modal-actions button {
            flex: 1;
            height: 45px;
            border-radius: 9px;
            border: none;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .cancel-btn {
            background: #eeeeee;
            color: #333;
        }

        .confirm-btn {
            background: #008b7d;
            color: white;
        }

        @media (min-width: 700px) {
            .header {
                padding-left: calc((100% - 650px) / 2);
                padding-right: calc((100% - 650px) / 2);
            }
        }
    </style>
</head>

<body>

<header class="header">
    <button class="back-btn" onclick="goBack()">
        <i data-lucide="arrow-left"></i>
    </button>

    <div class="header-title">Add Rent Plan</div>
</header>


<main class="content">

    <!-- PLAN DETAIL -->
    <section class="section-card">

        <div class="section-title">Plan Detail</div>

        <div class="divider"></div>

        <div class="field">
            <label class="field-label">
                Plan Name<span class="required">*</span>
            </label>

            <input
                type="text"
                id="planName"
                placeholder="Enter plan name"
                autocomplete="off"
            >
        </div>

    </section>


    <!-- RATE -->
    <section class="section-card">

        <div class="rate-box">

            <div class="rate-row">

                <span class="rate-label">Rate</span>

                <span class="rate-colon">:</span>

                <input
                    type="number"
                    id="rate"
                    class="rate-input"
                    value="0"
                    min="0"
                    inputmode="decimal"
                >

            </div>

        </div>

    </section>


    <!-- GST -->
    <section class="section-card">

        <div class="section-title">
            Total GST Percentage
        </div>

        <div class="divider"></div>

        <div class="gst-select-wrap">

            <select id="gst">
                <option value="0">0%</option>
                <option value="1">1%</option>
                <option value="2">2%</option>
                <option value="3">3%</option>
                <option value="5">5%</option>
                <option value="8">8%</option>
                <option value="10">10%</option>
                <option value="12">12%</option>
                <option value="18">18%</option>
                <option value="28">28%</option>
            </select>

            <i data-lucide="chevron-down" class="select-icon"></i>

        </div>

        <div class="preview" id="preview">

            <div class="preview-title">
                Bill Preview
            </div>

            <div class="preview-row">
                <span>Base Rate</span>
                <span id="previewRate">₹0</span>
            </div>

            <div class="preview-row">
                <span>GST</span>
                <span id="previewGst">₹0</span>
            </div>

            <div class="preview-row preview-total">
                <span>Total</span>
                <span id="previewTotal">₹0</span>
            </div>

        </div>

    </section>

</main>


<!-- SAVE BAR -->
<div class="bottom-save">
    <button class="save-btn" onclick="savePlan()">
        SAVE
    </button>
</div>


<!-- ERROR MODAL -->
<div class="modal-overlay" id="modal">

    <div class="modal">

        <h3>Plan Name Required</h3>

        <p>
            Please enter a name for this rent plan before saving it.
        </p>

        <div class="modal-actions">

            <button class="cancel-btn" onclick="closeModal()">
                OK
            </button>

        </div>

    </div>

</div>


<script type="module">

    import {
        auth,
        db
    } from "../js/firebase-config.js";

    import {
        collection,
        addDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    /* =====================================================
       INITIALIZE LUCIDE
       ===================================================== */

    lucide.createIcons();


    /* =====================================================
       INPUTS
       ===================================================== */

    const rateInput =
        document.getElementById("rate");

    const gstInput =
        document.getElementById("gst");

    const preview =
        document.getElementById("preview");


    /* =====================================================
       BILL PREVIEW
       ===================================================== */

    function updatePreview() {

        const rate =
            Number(rateInput.value) || 0;

        const gst =
            Number(gstInput.value) || 0;

        const gstAmount =
            rate * gst / 100;

        const total =
            rate + gstAmount;


        document.getElementById("previewRate").textContent =
            "₹" + rate.toLocaleString("en-IN");

        document.getElementById("previewGst").textContent =
            "₹" + gstAmount.toLocaleString("en-IN");

        document.getElementById("previewTotal").textContent =
            "₹" + total.toLocaleString("en-IN");


        if (rate > 0 || gst > 0) {

            preview.classList.add("show");

        } else {

            preview.classList.remove("show");

        }

    }


    rateInput.addEventListener(
        "input",
        updatePreview
    );

    gstInput.addEventListener(
        "change",
        updatePreview
    );


    /* =====================================================
       SAVE RENT PLAN TO FIRESTORE
       ===================================================== */

    async function savePlan() {

        const name =
            document
                .getElementById("planName")
                .value
                .trim();

        const rate =
            Number(rateInput.value) || 0;

        const gst =
            Number(gstInput.value) || 0;


        /* ---------------------------------------------
           VALIDATION
           --------------------------------------------- */

        if (!name) {

            document
                .getElementById("modal")
                .classList
                .add("show");

            return;

        }


        /* ---------------------------------------------
           CHECK LOGIN
           --------------------------------------------- */

        const user = auth.currentUser;


        if (!user) {

            alert(
                "Your session has expired. Please log in again."
            );

            window.location.href =
                "../auth/login.html";

            return;

        }


        /* ---------------------------------------------
           CALCULATE TOTAL
           --------------------------------------------- */

        const gstAmount =
            rate * gst / 100;

        const total =
            rate + gstAmount;


        /* ---------------------------------------------
           PREVENT DOUBLE CLICK
           --------------------------------------------- */

        const saveButton =
            document.querySelector(".save-btn");

        saveButton.disabled = true;

        saveButton.textContent = "SAVING...";


        try {

            /* -----------------------------------------
               FIRESTORE PATH

               users/
                 USER_UID/
                   rentPlans/
                     AUTO_PLAN_ID
               ----------------------------------------- */

            const rentPlansRef =
                collection(
                    db,
                    "users",
                    user.uid,
                    "rentPlans"
                );


            /* -----------------------------------------
               CREATE PLAN
               ----------------------------------------- */

            const planRef =
                await addDoc(
                    rentPlansRef,
                    {

                        name: name,

                        rate: rate,

                        gst: gst,

                        gstAmount: gstAmount,

                        total: total,

                        createdAt:
                            serverTimestamp()

                    }
                );


            /* -----------------------------------------
               OPEN PLAN DETAILS

               Pass Firestore document ID
               ----------------------------------------- */

            window.location.href =
                "plan-details.html?id="
                + encodeURIComponent(planRef.id);


        } catch (error) {

            console.error(
                "Error saving rent plan:",
                error
            );


            alert(
                "Could not save the rent plan.\n\n"
                + error.message
            );


            saveButton.disabled = false;

            saveButton.textContent = "SAVE";

        }

    }


    /* =====================================================
       MAKE FUNCTION AVAILABLE TO INLINE BUTTON
       ===================================================== */

    window.savePlan = savePlan;


    /* =====================================================
       CLOSE ERROR MODAL
       ===================================================== */

    function closeModal() {

        document
            .getElementById("modal")
            .classList
            .remove("show");

    }


    window.closeModal = closeModal;


    /* =====================================================
       BACK
       ===================================================== */

    function goBack() {

        window.history.back();

    }


    window.goBack = goBack;

</script>

</body>
</html>
