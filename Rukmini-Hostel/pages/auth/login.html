<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <meta name="theme-color" content="#00695C">

    <title>Login - Rukmini Hostel</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            min-height: 100%;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #F7F9F9;
            color: #263238;
        }


        /* ---------- PAGE ---------- */

        .page {
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }


        .container {
            width: 100%;
            max-width: 430px;
            min-height: 100vh;

            padding: 42px 24px 30px;

            display: flex;
            flex-direction: column;
        }


        /* ---------- BRAND ---------- */

        .brand {
            text-align: center;

            margin-top: 20px;
            margin-bottom: 42px;
        }


        .logo {
            width: 76px;
            height: 76px;

            margin: 0 auto 18px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: #FFFFFF;

            border-radius: 22px;

            overflow: hidden;

            box-shadow:
                0 8px 22px rgba(0, 105, 92, 0.18);
        }


        .logo img {
            width: 100%;
            height: 100%;

            object-fit: cover;

            display: block;
        }


        .brand h1 {
            font-size: 27px;
            font-weight: 700;

            color: #173F3A;
        }


        .brand p {
            margin-top: 7px;

            font-size: 14px;

            color: #78909C;
        }


        /* ---------- HEADING ---------- */

        .heading {
            margin-bottom: 25px;
        }


        .heading h2 {
            font-size: 25px;
            font-weight: 700;

            color: #263238;
        }


        .heading p {
            margin-top: 7px;

            font-size: 14px;

            line-height: 1.5;

            color: #78909C;
        }


        /* ---------- FORM ---------- */

        .form-group {
            margin-bottom: 19px;
        }


        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 13px;
            font-weight: 600;

            color: #455A64;
        }


        .input-wrapper {
            position: relative;
        }


        .input {
            width: 100%;
            height: 53px;

            border: 1px solid #D6DEDF;

            border-radius: 12px;

            background: #FFFFFF;

            padding: 0 15px;

            font-size: 15px;

            color: #263238;

            outline: none;

            transition: 0.2s ease;
        }


        .input:focus {
            border-color: #00897B;

            box-shadow:
                0 0 0 3px rgba(0, 137, 123, 0.10);
        }


        .input::placeholder {
            color: #B0BEC5;
        }


        /* ---------- PASSWORD ---------- */

        .password-input {
            padding-right: 52px;
        }


        .show-password {
            position: absolute;

            right: 15px;
            top: 50%;

            transform: translateY(-50%);

            border: none;

            background: transparent;

            color: #78909C;

            font-size: 12px;
            font-weight: 600;

            cursor: pointer;
        }


        /* ---------- FORGOT ---------- */

        .forgot-row {
            display: flex;

            justify-content: flex-end;

            margin-top: -5px;

            margin-bottom: 25px;
        }


        .forgot {
            border: none;

            background: none;

            color: #00796B;

            font-size: 13px;
            font-weight: 600;

            cursor: pointer;
        }


        /* ---------- LOGIN BUTTON ---------- */

        .login-button {
            width: 100%;
            height: 54px;

            border: none;

            border-radius: 13px;

            background: #00695C;

            color: white;

            font-size: 15px;
            font-weight: 700;

            cursor: pointer;

            box-shadow:
                0 7px 18px rgba(0, 105, 92, 0.20);

            transition: 0.15s ease;
        }


        .login-button:active {
            transform: scale(0.98);
        }


        .login-button:hover {
            background: #00564D;
        }


        /* ---------- DIVIDER ---------- */

        .divider {
            display: flex;

            align-items: center;

            gap: 12px;

            margin: 28px 0;
        }


        .divider-line {
            flex: 1;

            height: 1px;

            background: #E0E6E7;
        }


        .divider span {
            color: #90A4AE;

            font-size: 12px;
        }


        /* ---------- SIGNUP ---------- */

        .signup-row {
            text-align: center;

            font-size: 14px;

            color: #78909C;
        }


        .signup-link {
            border: none;

            background: none;

            color: #00796B;

            font-size: 14px;
            font-weight: 700;

            cursor: pointer;
        }


        /* ---------- FOOTER ---------- */

        .footer {
            margin-top: auto;

            padding-top: 35px;

            text-align: center;

            font-size: 11px;

            color: #B0BEC5;
        }


        /* ---------- ERROR ---------- */

        .error-message {
            display: none;

            margin-bottom: 18px;

            padding: 12px 14px;

            border-radius: 10px;

            background: #FFEBEE;

            color: #C62828;

            font-size: 13px;

            line-height: 1.4;
        }


        /* ---------- SMALL SCREENS ---------- */

        @media (max-height: 650px) {

            .container {
                padding-top: 25px;
            }


            .brand {
                margin-bottom: 25px;
            }


            .logo {
                width: 62px;
                height: 62px;

                margin-bottom: 12px;
            }


            .brand h1 {
                font-size: 24px;
            }


            .heading {
                margin-bottom: 18px;
            }

        }

    </style>
</head>


<body>


<div class="page">

    <main class="container">


        <!-- BRAND -->

        <section class="brand">

            <div class="logo">

                <img
                    src="../../assets/rukminilogo.png"
                    alt="Rukmini Hostel logo"
                >

            </div>


            <h1>Rukmini Hostel</h1>

            <p>Hostel Management</p>

        </section>


        <!-- HEADING -->

        <section class="heading">

            <h2>Welcome back</h2>

            <p>
                Login to manage your hostel, tenants and rent.
            </p>

        </section>


        <!-- ERROR -->

        <div
            class="error-message"
            id="errorMessage"
        ></div>


        <!-- LOGIN FORM -->

        <form id="loginForm">


            <!-- EMAIL -->

            <div class="form-group">

                <label for="email">
                    Email Address
                </label>


                <input
                    type="email"
                    id="email"
                    class="input"
                    placeholder="Enter your email address"
                    autocomplete="email"
                    required
                >

            </div>


            <!-- PASSWORD -->

            <div class="form-group">

                <label for="password">
                    Password
                </label>


                <div class="input-wrapper">

                    <input
                        type="password"
                        id="password"
                        class="input password-input"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >


                    <button
                        type="button"
                        class="show-password"
                        onclick="togglePassword()"
                    >
                        SHOW
                    </button>

                </div>

            </div>


            <!-- FORGOT -->

            <div class="forgot-row">

                <button
                    type="button"
                    class="forgot"
                    onclick="forgotPassword()"
                >
                    Forgot password?
                </button>

            </div>


            <!-- LOGIN -->

            <button
                type="submit"
                class="login-button"
            >
                Login
            </button>

        </form>


        <!-- DIVIDER -->

        <div class="divider">

            <div class="divider-line"></div>

            <span>OR</span>

            <div class="divider-line"></div>

        </div>


        <!-- SIGNUP -->

        <div class="signup-row">

            Don't have an account?


            <button
                type="button"
                class="signup-link"
                onclick="goToSignup()"
            >
                Create account
            </button>

        </div>


        <div class="footer">

            © 2026 Rukmini Hostel

        </div>


    </main>

</div>


<script type="module">


    /* ==========================================
       FIREBASE
       ========================================== */

    import {
        signInWithEmailAndPassword,
        sendPasswordResetEmail
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


    import { auth }
        from "../js/firebase-config.js";


    /* ==========================================
       PASSWORD VISIBILITY
       ========================================== */

    function togglePassword() {

        const password =
            document.getElementById("password");


        const button =
            document.querySelector(".show-password");


        if (password.type === "password") {

            password.type = "text";

            button.textContent = "HIDE";

        }

        else {

            password.type = "password";

            button.textContent = "SHOW";

        }

    }


    window.togglePassword =
        togglePassword;


    /* ==========================================
       SIGNUP NAVIGATION
       ========================================== */

    function goToSignup() {

        window.location.href =
            "signup.html";

    }


    window.goToSignup =
        goToSignup;


    /* ==========================================
       FORGOT PASSWORD
       ========================================== */

    async function forgotPassword() {

        const email =
            document
                .getElementById("email")
                .value
                .trim();


        if (!email) {

            showError(
                "Enter your email address first, then tap Forgot password."
            );

            return;

        }


        try {

            await sendPasswordResetEmail(
                auth,
                email
            );


            showSuccess(
                "Password reset email sent. Check your inbox."
            );


        }

        catch (error) {

            console.error(
                "Password reset error:",
                error
            );


            let message =
                "Unable to send password reset email.";


            if (
                error.code ===
                "auth/invalid-email"
            ) {

                message =
                    "Please enter a valid email address.";

            }

            else if (
                error.code ===
                "auth/user-not-found"
            ) {

                message =
                    "No account was found with this email.";

            }


            showError(message);

        }

    }


    window.forgotPassword =
        forgotPassword;


    /* ==========================================
       LOGIN
       ========================================== */

    document
        .getElementById("loginForm")
        .addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();


                const password =
                    document
                        .getElementById("password")
                        .value;


                /* ==================================
                   VALIDATION
                   ================================== */

                if (!email) {

                    showError(
                        "Please enter your email address."
                    );

                    return;

                }


                if (password.length < 6) {

                    showError(
                        "Password must contain at least 6 characters."
                    );

                    return;

                }


                /* ==================================
                   BUTTON STATE
                   ================================== */

                const button =
                    document.querySelector(
                        ".login-button"
                    );


                button.disabled = true;

                button.textContent =
                    "Logging in...";


                /* ==================================
                   FIREBASE LOGIN
                   ================================== */

                try {

                    const userCredential =
                        await signInWithEmailAndPassword(
                            auth,
                            email,
                            password
                        );


                    const user =
                        userCredential.user;


                    /*
                        Temporary session flag.

                        Firebase Auth itself maintains
                        the actual authentication session.
                    */

                    localStorage.setItem(
                        "rukmini_logged_in",
                        "true"
                    );


                    localStorage.setItem(
                        "rukmini_user_uid",
                        user.uid
                    );


                    /* ==============================
                       ENTER APP
                       ============================== */

                    window.location.href =
                        "../main/dashboard.html";


                }

                catch (error) {

                    console.error(
                        "Firebase login error:",
                        error
                    );


                    let message =
                        "Unable to login. Please try again.";


                    if (
                        error.code ===
                        "auth/invalid-credential"
                    ) {

                        message =
                            "Incorrect email or password.";

                    }

                    else if (
                        error.code ===
                        "auth/wrong-password"
                    ) {

                        message =
                            "Incorrect password.";

                    }

                    else if (
                        error.code ===
                        "auth/user-not-found"
                    ) {

                        message =
                            "No account was found with this email.";

                    }

                    else if (
                        error.code ===
                        "auth/invalid-email"
                    ) {

                        message =
                            "Please enter a valid email address.";

                    }

                    else if (
                        error.code ===
                        "auth/too-many-requests"
                    ) {

                        message =
                            "Too many login attempts. Please try again later.";

                    }


                    showError(message);


                    button.disabled = false;

                    button.textContent =
                        "Login";

                }

            }
        );


    /* ==========================================
       ERROR MESSAGE
       ========================================== */

    function showError(message) {

        const error =
            document.getElementById(
                "errorMessage"
            );


        error.textContent =
            message;


        error.style.display =
            "block";


        error.style.background =
            "#FFEBEE";


        error.style.color =
            "#C62828";

    }


    /* ==========================================
       SUCCESS MESSAGE
       ========================================== */

    function showSuccess(message) {

        const error =
            document.getElementById(
                "errorMessage"
            );


        error.textContent =
            message;


        error.style.display =
            "block";


        error.style.background =
            "#E8F5E9";


        error.style.color =
            "#2E7D32";

    }


</script>


</body>
</html>
