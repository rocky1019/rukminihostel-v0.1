<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#00695C">

<title>Dashboard - Rukmini Hostel</title>

<script src="https://unpkg.com/lucide@latest"></script>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    background:#F5F7F6;
    color:#263238;
    min-height:100vh;
    padding-bottom:30px;
}


/* =========================
   HEADER
========================= */

.header{
    height:72px;
    padding:0 20px;
    display:flex;
    align-items:center;
    justify-content:space-between;

    background:#00695C;
    border-bottom:1px solid #00574D;

    position:sticky;
    top:0;
    z-index:20;
}

.header-left{
    display:flex;
    align-items:center;
    gap:9px;
}

.header-logo{
    width:43px;
    height:43px;
    border-radius:12px;
    object-fit:cover;
    background:#fff;
    box-shadow:0 4px 12px rgba(0,0,0,.12);
}

.header-title{
    display:flex;
    flex-direction:column;
    gap:3px;
}

.header-title strong{
    font-size:17px;
    line-height:1;
    font-weight:700;
    color:#fff;
}

.header-title span{
    font-size:11px;
    color:#B2DFDB;
}

.profile-button{
    width:40px;
    height:40px;

    border:1px solid #4DB6AC;
    border-radius:50%;

    background:#087D70;
    color:#fff;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
}

.profile-button svg{
    width:19px;
    height:19px;
}


/* =========================
   PAGE
========================= */

.page{
    width:100%;
    max-width:600px;
    margin:auto;
    padding:16px 14px;
}


/* =========================
   WELCOME
========================= */

.welcome{
    padding:8px 3px 18px;
}

.welcome-label{
    font-size:12px;
    color:#78909C;
    margin-bottom:5px;
}

.welcome-name{
    font-size:25px;
    font-weight:700;
    color:#263238;
}

.welcome-sub{
    font-size:13px;
    color:#78909C;
    margin-top:6px;
    line-height:1.45;
}


/* =========================
   HOSTEL CARD
========================= */

.card{
    background:#fff;
    border-radius:12px;
    box-shadow:0 3px 12px rgba(0,0,0,.08);
    margin-bottom:12px;
    overflow:hidden;
}

.hostel-card{
    padding:18px;
}

.hostel-top{
    display:flex;
    align-items:center;
    gap:13px;
}

.hostel-icon{
    width:48px;
    height:48px;

    flex-shrink:0;

    border-radius:12px;

    background:#E0F2F1;
    color:#00695C;

    display:flex;
    align-items:center;
    justify-content:center;
}

.hostel-icon svg{
    width:23px;
    height:23px;
}

.hostel-info{
    min-width:0;
}

.hostel-name{
    font-size:18px;
    font-weight:700;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}

.hostel-location{
    font-size:12px;
    color:#78909C;
    margin-top:4px;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* =========================
   BASIC INFO
========================= */

.info-grid{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:10px;

    margin-top:16px;
}

.info-box{
    padding:12px;

    background:#F5F8F7;

    border-radius:9px;
}

.info-label{
    font-size:10px;
    color:#78909C;
    margin-bottom:5px;
}

.info-value{
    font-size:14px;
    font-weight:700;
    color:#263238;

    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* =========================
   SECTION TITLE
========================= */

.section-title{
    color:#00695C;
    font-size:16px;
    font-weight:700;

    padding:14px 15px 11px;

    border-bottom:1px solid #E4EAEA;
}


/* =========================
   QUICK ACTIONS
========================= */

.quick-grid{
    display:grid;
    grid-template-columns:1fr 1fr;

    gap:10px;

    padding:13px;
}

.quick-button{
    min-height:94px;

    border:1px solid #E3EBEA;

    border-radius:11px;

    background:#fff;

    padding:14px;

    display:flex;
    flex-direction:column;
    align-items:flex-start;
    justify-content:center;

    gap:9px;

    cursor:pointer;

    text-align:left;

    transition:.15s ease;
}

.quick-button:active{
    transform:scale(.98);
    background:#F5F9F8;
}

.quick-icon{
    width:37px;
    height:37px;

    border-radius:10px;

    background:#E6F4F2;
    color:#00695C;

    display:flex;
    align-items:center;
    justify-content:center;
}

.quick-icon svg{
    width:19px;
    height:19px;
}

.quick-title{
    font-size:13px;
    font-weight:700;
}

.quick-sub{
    font-size:10px;
    color:#78909C;
    margin-top:-5px;
}


/* =========================
   STATUS CARD
========================= */

.status-card{
    padding:15px;
}

.status-row{
    display:flex;
    align-items:center;
    gap:11px;
}

.status-dot{
    width:10px;
    height:10px;

    border-radius:50%;

    background:#26A69A;
}

.status-title{
    font-size:13px;
    font-weight:700;
}

.status-text{
    font-size:11px;
    color:#78909C;
    margin-top:3px;
}


/* =========================
   LOADING
========================= */

.loading{
    text-align:center;
    padding:30px 15px;
    color:#78909C;
    font-size:13px;
}


/* =========================
   ERROR
========================= */

.error{
    background:#FFEBEE;
    color:#C62828;

    padding:13px;

    border-radius:10px;

    font-size:12px;

    line-height:1.4;

    margin-bottom:12px;

    display:none;
}


/* =========================
   MOBILE
========================= */

@media(max-width:420px){

    .header{
        padding:0 16px;
    }

    .page{
        padding:14px 12px;
    }

    .quick-grid{
        grid-template-columns:1fr 1fr;
    }

}

@media(max-width:340px){

    .quick-grid{
        grid-template-columns:1fr;
    }

}

</style>
</head>


<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

    <div class="header-left">

        <img
            src="../../assets/rukminilogo.png"
            class="header-logo"
            alt="Rukmini Hostel"
        >

        <div class="header-title">

            <strong>
                Dashboard
            </strong>

            <span>
                Hostel Management
            </span>

        </div>

    </div>


    <button
        class="profile-button"
        onclick="openProfile()"
        aria-label="Profile"
    >

        <i data-lucide="user-round"></i>

    </button>

</header>



<!-- =========================
     PAGE
========================= -->

<main class="page">


    <!-- ERROR -->

    <div
        id="error"
        class="error"
    ></div>


    <!-- LOADING -->

    <div
        id="loading"
        class="loading"
    >
        Loading your hostel...
    </div>


    <!-- CONTENT -->

    <div
        id="content"
        style="display:none"
    >


        <!-- =========================
             WELCOME
        ========================== -->

        <section class="welcome">

            <div class="welcome-label">
                Welcome back
            </div>

            <div
                class="welcome-name"
                id="ownerName"
            >
                —
            </div>

            <div class="welcome-sub">
                Here's a quick overview of your hostel.
            </div>

        </section>



        <!-- =========================
             HOSTEL
        ========================== -->

        <section class="card hostel-card">

            <div class="hostel-top">

                <div class="hostel-icon">

                    <i data-lucide="building-2"></i>

                </div>


                <div class="hostel-info">

                    <div
                        class="hostel-name"
                        id="hostelName"
                    >
                        Rukmini Hostel
                    </div>

                    <div
                        class="hostel-location"
                        id="location"
                    >
                        —
                    </div>

                </div>

            </div>


            <div class="info-grid">


                <div class="info-box">

                    <div class="info-label">
                        TOTAL ROOMS
                    </div>

                    <div
                        class="info-value"
                        id="roomCount"
                    >
                        —
                    </div>

                </div>


                <div class="info-box">

                    <div class="info-label">
                        CONTACT
                    </div>

                    <div
                        class="info-value"
                        id="contact"
                    >
                        —
                    </div>

                </div>


            </div>

        </section>



        <!-- =========================
             QUICK ACCESS
        ========================== -->

        <section class="card">

            <div class="section-title">
                Quick Access
            </div>


            <div class="quick-grid">


                <button
                    class="quick-button"
                    onclick="goTo('rent-plans')"
                >

                    <div class="quick-icon">
                        <i data-lucide="receipt-text"></i>
                    </div>

                    <div class="quick-title">
                        Rent Plans
                    </div>

                    <div class="quick-sub">
                        Manage rent plans
                    </div>

                </button>



                <button
                    class="quick-button"
                    onclick="goTo('tenants')"
                >

                    <div class="quick-icon">
                        <i data-lucide="users-round"></i>
                    </div>

                    <div class="quick-title">
                        Tenants
                    </div>

                    <div class="quick-sub">
                        Manage tenants
                    </div>

                </button>



                <button
                    class="quick-button"
                    onclick="goTo('summary')"
                >

                    <div class="quick-icon">
                        <i data-lucide="chart-no-axes-combined"></i>
                    </div>

                    <div class="quick-title">
                        Summary
                    </div>

                    <div class="quick-sub">
                        View overview
                    </div>

                </button>



                <button
                    class="quick-button"
                    onclick="openProfile()"
                >

                    <div class="quick-icon">
                        <i data-lucide="user-round"></i>
                    </div>

                    <div class="quick-title">
                        Profile
                    </div>

                    <div class="quick-sub">
                        Manage account
                    </div>

                </button>


            </div>

        </section>



        <!-- =========================
             STATUS
        ========================== -->

        <section class="card status-card">

            <div class="status-row">

                <div class="status-dot"></div>

                <div>

                    <div class="status-title">
                        Account connected
                    </div>

                    <div class="status-text">
                        Your Rukmini Hostel account is connected to Firebase.
                    </div>

                </div>

            </div>

        </section>


    </div>


</main>



<script type="module">


/* ==========================================
   FIREBASE
========================================== */

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";


import {
    doc,
    getDoc
} from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


import {
    auth,
    db
} from "../js/firebase-config.js";



/* ==========================================
   ELEMENTS
========================================== */

const loading =
    document.getElementById("loading");

const content =
    document.getElementById("content");

const error =
    document.getElementById("error");

const ownerName =
    document.getElementById("ownerName");

const hostelName =
    document.getElementById("hostelName");

const locationText =
    document.getElementById("location");

const roomCount =
    document.getElementById("roomCount");

const contact =
    document.getElementById("contact");



/* ==========================================
   AUTH
========================================== */

onAuthStateChanged(
    auth,
    async function(user){

        if(!user){

            window.location.href =
                "../auth/login.html";

            return;

        }


        try{

            await loadDashboard(user);

        }

        catch(err){

            console.error(
                "Dashboard error:",
                err
            );

            loading.style.display =
                "none";

            error.style.display =
                "block";

            error.textContent =
                "Unable to load your account information. Please try again.";

        }

    }
);



/* ==========================================
   LOAD PROFILE
========================================== */

async function loadDashboard(user){

    const userRef =
        doc(
            db,
            "users",
            user.uid
        );


    const snapshot =
        await getDoc(userRef);


    if(!snapshot.exists()){

        /*
            Account setup hasn't been completed.
        */

        window.location.href =
            "../auth/account-setup.html";

        return;

    }


    const data =
        snapshot.data();


    /* ==============================
       OWNER
    ============================== */

    ownerName.textContent =
        data.name ||
        "Welcome";



    /* ==============================
       HOSTEL
    ============================== */

    hostelName.textContent =
        data.hostelName ||
        "Rukmini Hostel";



    /* ==============================
       LOCATION
    ============================== */

    let location = "";


    if(data.city){

        location +=
            data.city;

    }


    if(data.state){

        if(location){
            location += ", ";
        }

        location +=
            data.state;

    }


    if(!location){

        location =
            data.address ||
            "Hostel information";

    }


    locationText.textContent =
        location;



    /* ==============================
       ROOMS
    ============================== */

    roomCount.textContent =
        data.roomCount ||
        "Not set";



    /* ==============================
       CONTACT
    ============================== */

    contact.textContent =
        data.contactNumber ||
        "Not set";



    /* ==============================
       SHOW
    ============================== */

    loading.style.display =
        "none";

    content.style.display =
        "block";


    lucide.createIcons();

}



/* ==========================================
   NAVIGATION
========================================== */

window.goTo =
    function(page){

        if(page === "rent-plans"){

            window.location.href =
                "rent-plans.html";

        }


        if(page === "tenants"){

            window.location.href =
                "tenants.html";

        }


        if(page === "summary"){

            window.location.href =
                "summary.html";

        }

    };



/* ==========================================
   PROFILE
========================================== */

window.openProfile =
    function(){

       window.location.href = "../tools/profile.html";

    };



</script>

</body>
</html>
